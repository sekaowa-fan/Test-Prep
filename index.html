<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0285FF">
<title>テスト前対策アプリ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding:16px 16px 100px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:23px;
}

.primary,
.blue{
  background:#0285FF;
  color:#fff;
  border-radius:12px;
  padding:12px 16px;
  font-weight:700;
}

.textbtn{
  background:none;
  color:#0285FF;
  padding:9px;
  font-weight:700;
}

.danger{
  color:#e53935;
}

.card{
  border:1px solid #e2e7ec;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  background:#fff;
}

.test-name{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.spacer{
  flex:1;
}

.muted{
  color:#777;
}

.small{
  font-size:13px;
}

.section{
  margin:22px 0;
}

input[type="text"]{
  width:100%;
  margin-top:6px;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:12px;
  outline:none;
}

input[type="text"]:focus{
  border-color:#0285FF;
}

.problem-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #e2e7ec;
  border-radius:13px;
  background:#fff;
}

.drag{
  color:#777;
  font-size:23px;
  cursor:grab;
  user-select:none;
}

.problem-title{
  font-weight:700;
}

.drop-target{
  border:2px dashed #0285FF;
}

.dragging{
  opacity:.45;
}

.hidden{
  display:none!important;
}

/* =========================
   問題編集
========================= */

.editor-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#f2f3f5;
  touch-action:none;
  user-select:none;
}

.editor-img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
}

.mask{
  position:absolute;
  border:3px solid #ff3333;
  background:#ff3b3038;
  min-width:25px;
  min-height:25px;
  touch-action:none;
}

.mask.selected{
  box-shadow:0 0 0 3px #0285FF55;
}

.resize-handle{
  position:absolute;
  right:-10px;
  bottom:-10px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#fff;
  border:3px solid #0285FF;
  touch-action:none;
}

/* =========================
   解答画面
========================= */

.answer-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
}

.answer-img{
  display:block;
  width:100%;
  height:auto;
}

.answer-mask{
  position:absolute;
  background:#ff3030;
  border:3px solid #ff3030;
  cursor:pointer;
}

.answer-mask.revealed{
  background:transparent;
  border-color:transparent;
  pointer-events:none;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:10px;
  padding:10px 16px;
  background:#fff;
  border-top:1px solid #e5e5e5;
  z-index:50;
}

.bottom button{
  flex:1;
}

/* =========================
   モーダル・通知
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#0007;
}

.modal-box{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  padding:20px;
  border-radius:18px;
  background:#fff;
}

.modal-box h3{
  margin-top:0;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-buttons button{
  flex:1;
}

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  z-index:200;
  padding:10px 16px;
  border-radius:20px;
  background:#111;
  color:#fff;
  white-space:nowrap;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
"use strict";

/* ==================================================
   データ
================================================== */

const STORAGE_KEY = "test_before_app_v4";

let db = {
  tests: [],
  fixedId: null
};

let state = {
  screen: "home",
  testId: null,
  problemId: null,
  editImage: null,
  masks: [],
  selectedMask: null,
  answerIndex: 0
};
  function loadDB(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      const parsed =
        JSON.parse(saved);

      if(
        parsed &&
        Array.isArray(parsed.tests)
      ){

        db = parsed;

      }

    }

  }catch(error){

    console.error(
      "データ読み込みエラー:",
      error
    );

    db = {
      tests:[],
      fixedId:null
    };

  }

  if(!Array.isArray(db.tests)){

    db.tests = [];

  }

}

function saveDB(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.error(
      "保存エラー:",
      error
    );

    showToast(
      "保存できませんでした"
    );

  }

}

function $(id){

  return document.getElementById(id);

}

function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];

    }
  );

}

function getTest(){

  return db.tests.find(
    t => t.id === state.testId
  ) || null;

}

function getProblem(){

  const test =
    getTest();

  if(!test){

    return null;

  }

  return test.problems.find(
    p => p.id === state.problemId
  ) || null;

}

function showToast(text){

  const old =
    document.querySelector(
      ".toast"
    );

  if(old){

    old.remove();

  }

  const toast =
    document.createElement(
      "div"
    );

  toast.className =
    "toast";

  toast.textContent =
    text;

  document.body.appendChild(
    toast
  );

  setTimeout(
    () => toast.remove(),
    1600
  );

}

function go(screen){

  state.screen =
    screen;

  render();

  window.scrollTo(
    0,
    0
  );

  }
  function header(title,rightHTML=""){

  return `
    <header class="header">

      <h1>${title}</h1>

      <div>
        ${rightHTML}
      </div>

    </header>
  `;

}

function renderHome(){

  let tests = "";

  if(db.tests.length === 0){

    tests = `
      <div class="card muted">
        まだテストがありません。<br>
        「＋ テスト作成」から作ってみよう！
      </div>
    `;

  }else{

    const sorted =
      [...db.tests].sort(
        (a,b) => {

          if(db.fixedId === a.id){
            return -1;
          }

          if(db.fixedId === b.id){
            return 1;
          }

          return 0;

        }
      );

    tests = sorted.map(
      test => {

        const fixed =
          db.fixedId === test.id
          ? `
            <span
              class="small"
              style="color:#0285FF">
              ● 固定中
            </span>
          `
          : "";

        return `
          <div class="card">

            <div class="test-name">
              ${escapeHTML(test.name)}
              ${fixed}
            </div>

            <div class="row">

              <button
                class="blue play-test"
                data-id="${test.id}">
                解答する
              </button>

              <button
                class="textbtn settings-test"
                data-id="${test.id}">
                設定
              </button>

            </div>

          </div>
        `;

      }
    ).join("");

  }

  return `
    <div class="app">

      ${header(
        "テスト前対策アプリ",
        `
          <button
            class="primary"
            id="new-test">
            ＋ テスト作成
          </button>
        `
      )}

      ${tests}

    </div>
  `;

}

function renderCreate(){

  const test =
    getTest();

  if(!test){

    return `
      <div class="app">

        <p>
          テストが見つかりません。
        </p>

        <button
          class="blue"
          id="back-home">
          ホーム
        </button>

      </div>
    `;

  }

  const problems =
    test.problems.map(
      (problem,index) => {

        return `
          <div
            class="problem-row"
            draggable="true"
            data-problem-id="${problem.id}">

            <span class="drag">
              ☰
            </span>

            <span class="problem-title">
              ${index + 1}問目
            </span>

            <span class="spacer"></span>

            <button
              class="textbtn edit-problem"
              data-id="${problem.id}">
              編集
            </button>

            <button
              class="textbtn danger delete-problem"
              data-id="${problem.id}">
              削除
            </button>

          </div>
        `;

      }
    ).join("");

  return `
    <div class="app">

      ${header(
        "テスト作成",
        `
          <button
            class="blue"
            id="add-problem">
            ＋ 問題追加
          </button>
        `
      )}

      <div class="section">

        <label class="small muted">
          テスト名
        </label>

        <input
          id="test-name"
          type="text"
          value="${escapeHTML(test.name)}">

      </div>

      <div id="problem-list">

        ${
          problems ||
          `
            <p class="muted">
              問題を追加してください。
            </p>
          `
        }

      </div>

      <div class="section">

        <button
          class="blue"
          id="save-create">
          保存する
        </button>

      </div>

    </div>
  `;

}

function renderEdit(){

  const problem =
    getProblem();

  if(!problem){

    return `
      <div class="app">

        ${header("問題編集")}

        <p>
          問題が見つかりません。
        </p>

        <button
          class="blue"
          id="back-create">
          戻る
        </button>

      </div>
    `;

  }

  let editorHTML = "";

  if(state.editImage){

    const masks =
      state.masks.map(
        mask => {

          return `
            <div
              class="mask ${
                state.selectedMask === mask.id
                ? "selected"
                : ""
              }"
              data-mask-id="${mask.id}"
              style="
                left:${mask.x}%;
                top:${mask.y}%;
                width:${mask.w}%;
                height:${mask.h}%;
              ">

              ${
                state.selectedMask === mask.id
                ? `<span class="resize-handle"></span>`
                : ""
              }

            </div>
          `;

        }
      ).join("");

    editorHTML = `
      <div
        class="editor-wrap"
        id="editor">

        <img
          id="editor-image"
          class="editor-img"
          src="${state.editImage}"
          alt="教科書画像">

        ${masks}

      </div>
    `;

  }else{

    editorHTML = `
      <div class="card">

        <button
          class="blue"
          id="pick-image">
          教科書の画像を追加
        </button>

        <input
          id="image-input"
          class="hidden"
          type="file"
          accept="image/*">

      </div>
    `;

  }

  const maskList =
    state.masks.map(
      (mask,index) => {

        return `
          <div class="card row">

            <b>
              ${index + 1}個目
            </b>

            <span class="spacer"></span>

            <button
              class="textbtn danger delete-mask"
              data-id="${mask.id}">
              削除
            </button>

          </div>
        `;

      }
    ).join("");

  return `
    <div class="app">

      ${header(
        "問題編集",
        `
          <button
            class="blue"
            id="save-problem">
            保存
          </button>
        `
      )}

      <div
        class="small muted"
        style="margin-bottom:8px">

        赤い枠をドラッグして移動できます。<br>
        青い丸をドラッグすると大きさを変更できます。

      </div>

      ${editorHTML}

      ${
        state.editImage
        ? `
          <div class="row mask-tools">

            <button
              class="blue"
              id="add-mask">
              ＋ 隠す場所を追加
            </button>

            <span class="muted small">
              ${state.masks.length}個の隠し場所
            </span>

          </div>
        `
        : ""
      }

      ${maskList}

      <div class="section">

        <button
          class="blue"
          id="add-problem-from-edit">
          ＋ 問題を追加
        </button>

      </div>

      <div class="section">

        <button
          class="textbtn danger"
          id="delete-current-problem">
          この問題を削除
        </button>

      </div>

    </div>
  `;

}
  function renderSettings(){

  const test =
    getTest();

  if(!test){

    return `
      <div class="app">

        <p>
          テストが見つかりません。
        </p>

      </div>
    `;

  }

  const list =
    test.problems.map(
      (problem,index) => {

        return `
          <div class="problem-row">

            <span>
              ${index + 1}問目
            </span>

            <span class="spacer"></span>

            <button
              class="textbtn edit-problem"
              data-id="${problem.id}">
              編集
            </button>

            <button
              class="textbtn danger delete-problem"
              data-id="${problem.id}">
              削除
            </button>

          </div>
        `;

      }
    ).join("");

  return `
    <div class="app">

      ${header(
        "設定",
        `
          <button
            class="textbtn back-home">
            ホーム
          </button>
        `
      )}

      <div class="section">

        <label class="small muted">
          テスト名
        </label>

        <input
          id="setting-name"
          type="text"
          value="${escapeHTML(test.name)}">

      </div>

      <div class="card row">

        <input
          id="fixed-test"
          type="checkbox"
          ${
            db.fixedId === test.id
            ? "checked"
            : ""
          }>

        <label for="fixed-test">
          このテストをトップに固定する
        </label>

      </div>

      <div class="section">

        <h2>問題一覧</h2>

        ${
          list ||
          `
            <p class="muted">
              問題がありません。
            </p>
          `
        }

      </div>

      <div class="section">

        <button
          class="textbtn danger"
          id="delete-test">
          ⚠️ テストを削除
        </button>

      </div>

    </div>
  `;

}

function renderPlay(){

  const test =
    getTest();

  if(
    !test ||
    test.problems.length === 0
  ){

    return `
      <div class="app">

        ${header(
          "解答",
          `
            <button
              class="textbtn quit">
              ホーム
            </button>
          `
        )}

        <p>
          問題がありません。
        </p>

      </div>
    `;

  }

  if(
    state.answerIndex < 0 ||
    state.answerIndex >=
    test.problems.length
  ){

    state.answerIndex = 0;

  }

  const problem =
    test.problems[
      state.answerIndex
    ];

  if(!problem.revealed){

    problem.revealed = {};

  }

  const masks =
    (problem.masks || []).map(
      mask => {

        const revealed =
          problem.revealed[
            mask.id
          ] === true;

        return `
          <div
            class="answer-mask ${
              revealed
              ? "revealed"
              : ""
            }"
            data-mask-id="${mask.id}"
            style="
              left:${mask.x}%;
              top:${mask.y}%;
              width:${mask.w}%;
              height:${mask.h}%;
            ">
          </div>
        `;

      }
    ).join("");

  return `
    <div class="app">

      ${header(
        `${state.answerIndex + 1} / ${test.problems.length}`,
        `
          <button
            class="textbtn quit">
            ホーム
          </button>
        `
      )}

      <div class="card">

        <div class="test-name">
          ${escapeHTML(test.name)}
        </div>

      </div>

      <div class="answer-wrap">

        <img
          class="answer-img"
          src="${problem.image}"
          alt="問題">

        ${masks}

      </div>

      <div class="bottom">

        <button
          class="blue"
          id="prev">
          ← 前へ
        </button>

        <button
          class="blue"
          id="next">
          次へ →
        </button>

      </div>

    </div>
  `;

}

function render(){

  const app =
    $("app");

  if(!app){

    return;

  }

  try{

    switch(state.screen){

      case "home":

        app.innerHTML =
          renderHome();

        break;

      case "create":

        app.innerHTML =
          renderCreate();

        break;

      case "edit":

        app.innerHTML =
          renderEdit();

        break;

      case "settings":

        app.innerHTML =
          renderSettings();

        break;

      case "play":

        app.innerHTML =
          renderPlay();

        break;

      default:

        state.screen =
          "home";

        app.innerHTML =
          renderHome();

    }

    bindEvents();

  }catch(error){

    console.error(
      "描画エラー:",
      error
    );

    app.innerHTML = `
      <div class="app">

        <h1>
          エラーが発生しました
        </h1>

        <div class="card">

          <p>
            アプリの読み込み中に
            エラーが発生しました。
          </p>

          <button
            class="blue"
            onclick="location.reload()">
            再読み込み
          </button>

        </div>

      </div>
    `;

  }

}
  function createTest(){

  const test = {

    id:uid(),

    name:"新しいテスト",

    problems:[]

  };

  db.tests.push(test);

  state.testId =
    test.id;

  state.problemId =
    null;

  saveDB();

  go("create");

}

function addProblem(){

  const test =
    getTest();

  if(!test){

    showToast(
      "テストが見つかりません"
    );

    return;

  }

  const problem = {

    id:uid(),

    image:"",

    masks:[],

    revealed:{}

  };

  test.problems.push(
    problem
  );

  state.problemId =
    problem.id;

  state.editImage =
    null;

  state.masks = [];

  state.selectedMask =
    null;

  saveDB();

  go("edit");

}

function openProblem(id){

  const test =
    getTest();

  if(!test){

    return;

  }

  const problem =
    test.problems.find(
      p => p.id === id
    );

  if(!problem){

    return;

  }

  state.problemId =
    id;

  state.editImage =
    problem.image ||
    null;

  state.masks =
    JSON.parse(
      JSON.stringify(
        problem.masks || []
      )
    );

  state.selectedMask =
    null;

  go("edit");

}

function readImage(file){

  if(!file){

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(){

      state.editImage =
        reader.result;

      render();

    };

  reader.onerror =
    function(){

      showToast(
        "画像を読み込めませんでした"
      );

    };

  reader.readAsDataURL(
    file
  );

}

function saveProblem(){

  const problem =
    getProblem();

  if(!problem){

    return;

  }

  if(!state.editImage){

    showToast(
      "画像を追加してください"
    );

    return;

  }

  problem.image =
    state.editImage;

  problem.masks =
    state.masks.map(
      mask => ({

        id:mask.id,

        x:mask.x,

        y:mask.y,

        w:mask.w,

        h:mask.h

      })
    );

  problem.revealed = {};

  saveDB();

  go("create");

}

function deleteProblem(id){

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "この問題を削除しますか？"
    )
  ){

    return;

  }

  test.problems =
    test.problems.filter(
      p => p.id !== id
    );

  if(
    state.problemId === id
  ){

    state.problemId =
      null;

    state.editImage =
      null;

    state.masks = [];

    state.selectedMask =
      null;

  }

  saveDB();

  render();

}

function deleteCurrentProblem(){

  if(!state.problemId){

    return;

  }

  const id =
    state.problemId;

  state.problemId =
    null;

  state.editImage =
    null;

  state.masks = [];

  state.selectedMask =
    null;

  deleteProblem(id);

  go("create");

}
  function deleteTest(){

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "このテストを削除しますか？\n\nこの操作は元に戻せません。"
    )
  ){

    return;

  }

  db.tests =
    db.tests.filter(
      t => t.id !== test.id
    );

  if(
    db.fixedId === test.id
  ){

    db.fixedId =
      null;

  }

  state.testId =
    null;

  state.problemId =
    null;

  saveDB();

  go("home");

}

function addProblemFromEdit(){

  const problem =
    getProblem();

  if(
    problem &&
    state.editImage
  ){

    problem.image =
      state.editImage;

    problem.masks =
      state.masks.map(
        mask => ({

          id:mask.id,

          x:mask.x,

          y:mask.y,

          w:mask.w,

          h:mask.h

        })
      );

    problem.revealed = {};

  }

  saveDB();

  addProblem();

}

function addMask(){

  if(!state.editImage){

    showToast(
      "先に画像を追加してください"
    );

    return;

  }

  const mask = {

    id:uid(),

    x:30,

    y:30,

    w:30,

    h:15

  };

  state.masks.push(
    mask
  );

  state.selectedMask =
    mask.id;

  render();

}

function setupMaskControls(){

  const editor =
    $("editor");

  if(!editor){

    return;

  }

  document
    .querySelectorAll(".mask")
    .forEach(
      element => {

        const id =
          element.dataset.maskId;

        const mask =
          state.masks.find(
            m => m.id === id
          );

        if(!mask){

          return;

        }

        element.addEventListener(
          "pointerdown",
          function(event){

            if(
              event.target.classList.contains(
                "resize-handle"
              )
            ){

              return;

            }

            event.preventDefault();

            event.stopPropagation();

            state.selectedMask =
              id;

            const rect =
              editor.getBoundingClientRect();

            const startX =
              event.clientX;

            const startY =
              event.clientY;

            const startLeft =
              mask.x;

            const startTop =
              mask.y;

            element.setPointerCapture(
              event.pointerId
            );

            function move(ev){

              const dx =
                (
                  ev.clientX -
                  startX
                ) /
                rect.width *
                100;

              const dy =
                (
                  ev.clientY -
                  startY
                ) /
                rect.height *
                100;

              mask.x =
                Math.max(
                  0,
                  Math.min(
                    100 - mask.w,
                    startLeft + dx
                  )
                );

              mask.y =
                Math.max(
                  0,
                  Math.min(
                    100 - mask.h,
                    startTop + dy
                  )
                );

              element.style.left =
                mask.x + "%";

              element.style.top =
                mask.y + "%";

            }

            function end(){

              try{

                element.releasePointerCapture(
                  event.pointerId
                );

              }catch(error){}

              element.removeEventListener(
                "pointermove",
                move
              );

              element.removeEventListener(
                "pointerup",
                end
              );

            }

            element.addEventListener(
              "pointermove",
              move
            );

            element.addEventListener(
              "pointerup",
              end
            );

          }
        );

        const handle =
          element.querySelector(
            ".resize-handle"
          );

        if(!handle){

          return;

        }

        handle.addEventListener(
          "pointerdown",
          function(event){

            event.preventDefault();

            event.stopPropagation();

            state.selectedMask =
              id;

            const rect =
              editor.getBoundingClientRect();

            const startX =
              event.clientX;

            const startY =
              event.clientY;

            const startW =
              mask.w;

            const startH =
              mask.h;

            handle.setPointerCapture(
              event.pointerId
            );

            function resize(ev){

              const dx =
                (
                  ev.clientX -
                  startX
                ) /
                rect.width *
                100;

              const dy =
                (
                  ev.clientY -
                  startY
                ) /
                rect.height *
                100;

              mask.w =
                Math.max(
                  5,
                  Math.min(
                    100 - mask.x,
                    startW + dx
                  )
                );

              mask.h =
                Math.max(
                  5,
                  Math.min(
                    100 - mask.y,
                    startH + dy
                  )
                );

              element.style.width =
                mask.w + "%";

              element.style.height =
                mask.h + "%";

            }

            function end(){

              try{

                handle.releasePointerCapture(
                  event.pointerId
                );

              }catch(error){}

              handle.removeEventListener(
                "pointermove",
                resize
              );

              handle.removeEventListener(
                "pointerup",
                end
              );

            }

            handle.addEventListener(
              "pointermove",
              resize
            );

            handle.addEventListener(
              "pointerup",
              end
            );

          }
        );

      }
    );

                }
  function enableSorting(){

  const rows =
    document.querySelectorAll(
      ".problem-row[draggable='true']"
    );

  let draggedId =
    null;

  rows.forEach(
    row => {

      row.addEventListener(
        "dragstart",
        function(event){

          draggedId =
            row.dataset.problemId;

          row.classList.add(
            "dragging"
          );

          if(event.dataTransfer){

            event.dataTransfer.effectAllowed =
              "move";

            event.dataTransfer.setData(
              "text/plain",
              draggedId
            );

          }

        }
      );

      row.addEventListener(
        "dragend",
        function(){

          row.classList.remove(
            "dragging"
          );

          document
            .querySelectorAll(
              ".problem-row"
            )
            .forEach(
              r =>
                r.classList.remove(
                  "drop-target"
                )
            );

          draggedId =
            null;

        }
      );

      row.addEventListener(
        "dragover",
        function(event){

          event.preventDefault();

          if(
            draggedId &&
            draggedId !==
            row.dataset.problemId
          ){

            row.classList.add(
              "drop-target"
            );

          }

        }
      );

      row.addEventListener(
        "dragleave",
        function(){

          row.classList.remove(
            "drop-target"
          );

        }
      );

      row.addEventListener(
        "drop",
        function(event){

          event.preventDefault();

          row.classList.remove(
            "drop-target"
          );

          let fromId =
            draggedId;

          if(
            !fromId &&
            event.dataTransfer
          ){

            fromId =
              event.dataTransfer.getData(
                "text/plain"
              );

          }

          const toId =
            row.dataset.problemId;

          if(
            !fromId ||
            !toId ||
            fromId === toId
          ){

            return;

          }

          const test =
            getTest();

          if(!test){

            return;

          }

          const fromIndex =
            test.problems.findIndex(
              p => p.id === fromId
            );

          const toIndex =
            test.problems.findIndex(
              p => p.id === toId
            );

          if(
            fromIndex === -1 ||
            toIndex === -1
          ){

            return;

          }

          const moved =
            test.problems.splice(
              fromIndex,
              1
            )[0];

          test.problems.splice(
            toIndex,
            0,
            moved
          );

          saveDB();

          render();

        }
      );

    }
  );

}

function bindEvents(){

  const newTest =
    $("new-test");

  if(newTest){

    newTest.onclick =
      createTest;

  }

  const addProblemButton =
    $("add-problem");

  if(addProblemButton){

    addProblemButton.onclick =
      addProblem;

  }

  document
    .querySelectorAll(
      ".edit-problem"
    )
    .forEach(
      button => {

        button.onclick =
          function(){

            openProblem(
              button.dataset.id
            );

          };

      }
    );

  document
    .querySelectorAll(
      ".delete-problem"
    )
    .forEach(
      button => {

        button.onclick =
          function(){

            deleteProblem(
              button.dataset.id
            );

          };

      }
    );

  const testName =
    $("test-name");

  const saveCreate =
    $("save-create");

  if(saveCreate){

    saveCreate.onclick =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        test.name =
          testName.value.trim() ||
          "無題のテスト";

        saveDB();

        go("home");

      };

  }

  const pickImage =
    $("pick-image");

  const imageInput =
    $("image-input");

  if(
    pickImage &&
    imageInput
  ){

    pickImage.onclick =
      function(){

        imageInput.click();

      };

    imageInput.onchange =
      function(){

        const file =
          imageInput.files &&
          imageInput.files[0];

        if(file){

          readImage(file);

        }

      };

  }

  const saveProblemButton =
    $("save-problem");

  if(saveProblemButton){

    saveProblemButton.onclick =
      saveProblem;

  }

  const addMaskButton =
    $("add-mask");

  if(addMaskButton){

    addMaskButton.onclick =
      addMask;

  }

  document
    .querySelectorAll(
      ".delete-mask"
    )
    .forEach(
      button => {

        button.onclick =
          function(){

            const id =
              button.dataset.id;

            state.masks =
              state.masks.filter(
                mask =>
                  mask.id !== id
              );

            if(
              state.selectedMask === id
            ){

              state.selectedMask =
                null;

            }

            render();

          };

      }
    );

  const addFromEdit =
    $("add-problem-from-edit");

  if(addFromEdit){

    addFromEdit.onclick =
      addProblemFromEdit;

  }

  const deleteCurrent =
    $("delete-current-problem");

  if(deleteCurrent){

    deleteCurrent.onclick =
      deleteCurrentProblem;

  }

  document
    .querySelectorAll(
      ".settings-test"
    )
    .forEach(
      button => {

        button.onclick =
          function(){

            state.testId =
              button.dataset.id;

            go("settings");

          };

      }
    );

  document
    .querySelectorAll(
      ".back-home"
    )
    .forEach(
      button => {

        button.onclick =
          () => go("home");

      }
    );

  const settingName =
    $("setting-name");

  if(settingName){

    settingName.onchange =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        test.name =
          settingName.value.trim() ||
          "無題のテスト";

        saveDB();

      };

  }

  const fixedTest =
    $("fixed-test");

  if(fixedTest){

    fixedTest.onchange =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        if(fixedTest.checked){

          db.fixedId =
            test.id;

        }else{

          if(
            db.fixedId ===
            test.id
          ){

            db.fixedId =
              null;

          }

        }

        saveDB();

        render();

      };

  }

  const deleteTestButton =
    $("delete-test");

  if(deleteTestButton){

    deleteTestButton.onclick =
      deleteTest;

  }

  document
    .querySelectorAll(
      ".play-test"
    )
    .forEach(
      button => {

        button.onclick =
          function(){

            state.testId =
              button.dataset.id;

            state.answerIndex =
              0;

            const test =
              getTest();

            if(
              !test ||
              test.problems.length === 0
            ){

              showToast(
                "このテストには問題がありません"
              );

              return;

            }

            test.problems.forEach(
              problem => {

                problem.revealed =
                  {};

              }
            );

            saveDB();

            go("play");

          };

      }
    );

  document
    .querySelectorAll(
      ".answer-mask"
    )
    .forEach(
      mask => {

        mask.onclick =
          function(){

            const test =
              getTest();

            if(!test){

              return;

            }

            const problem =
              test.problems[
                state.answerIndex
              ];

            if(!problem){

              return;

            }

            if(!problem.revealed){

              problem.revealed =
                {};

            }

            const id =
              mask.dataset.maskId;

            problem.revealed[id] =
              !problem.revealed[id];

            saveDB();

            render();

          };

      }
    );

  const prev =
    $("prev");

  if(prev){

    prev.onclick =
      function(){

        if(
          state.answerIndex > 0
        ){

          state.answerIndex--;

          render();

        }

      };

  }

  const next =
    $("next");

  if(next){

    next.onclick =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        if(
          state.answerIndex <
          test.problems.length - 1
        ){

          state.answerIndex++;

          render();

        }else{

          go("home");

        }

      };

  }

  document
    .querySelectorAll(
      ".quit,#back-home"
    )
    .forEach(
      button => {

        button.onclick =
          () => go("home");

      }
    );

  const backCreate =
    $("back-create");

  if(backCreate){

    backCreate.onclick =
      () => go("create");

  }

  setupMaskControls();

  enableSorting();

}

function start(){

  loadDB();

  state.screen =
    "home";

  render();

}

start();

  </script>
