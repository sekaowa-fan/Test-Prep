<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
  name="theme-color"
  content="#0285FF"
>

<title>テスト前対策アプリ</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#fff;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  min-height:100vh;
  padding:16px 16px 90px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:23px;
  line-height:1.3;
}

.primary{
  padding:12px 16px;
  border-radius:12px;
  background:#0285FF;
  color:#fff;
  font-weight:700;
}

.blue{
  padding:12px 16px;
  border-radius:12px;
  background:#0285FF;
  color:#fff;
  font-weight:700;
}

.textbtn{
  padding:9px;
  background:transparent;
  color:#0285FF;
  font-weight:700;
}

.danger{
  color:#e53935;
}

.card{
  margin:12px 0;
  padding:16px;
  border:1px solid #e3e7eb;
  border-radius:16px;
  background:#fff;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
}

.spacer{
  flex:1;
}

.muted{
  color:#777;
}

.small{
  font-size:13px;
}

.section{
  margin:20px 0;
}

input[type="text"]{
  width:100%;
  margin-top:7px;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:12px;
  outline:none;
  background:#fff;
}

input[type="text"]:focus{
  border-color:#0285FF;
}

/* =========================
   テスト一覧
========================= */

.test-card{
  position:relative;
}

.test-title{
  margin-bottom:12px;
  font-size:18px;
  font-weight:700;
}

.fixed-badge{
  display:inline-block;
  margin-left:6px;
  padding:3px 7px;
  border-radius:8px;
  background:#e8f3ff;
  color:#0285FF;
  font-size:11px;
  font-weight:700;
}

/* =========================
   問題一覧
========================= */

.problem-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  min-height:58px;
  margin:8px 0;
  padding:8px 10px;
  border:1px solid #e1e6eb;
  border-radius:14px;
  background:#fff;

  /*
    並び替え中のブラウザ標準操作を防止
  */
  touch-action:pan-y;
}

.problem-row.dragging{
  opacity:.45;
  transform:scale(.98);
}

.problem-row.drop-before{
  border-top:3px solid #0285FF;
}

.problem-row.drop-after{
  border-bottom:3px solid #0285FF;
}

/*
  並び替え専用ボタン
*/
.sort-handle{
  flex:none;
  width:38px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:#f2f4f6;

  color:#777;

  font-size:22px;

  user-select:none;

  touch-action:none;
}

.problem-number{
  min-width:45px;
  font-weight:700;
}

.problem-status{
  font-size:12px;
  color:#777;
}

.problem-actions{
  display:flex;
  align-items:center;
  gap:2px;
}

/* =========================
   画像編集
========================= */

.editor{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#f2f3f5;

  /*
    画像編集は指で操作する
  */
  touch-action:none;

  user-select:none;
}

.editor-image{
  display:block;
  width:100%;
  height:auto;

  pointer-events:none;
  user-select:none;
}

/*
  赤枠

  min-width / min-height は設定しない。
  これが「極細にした時のズレ」を防ぐ。
*/
.mask{
  position:absolute;

  margin:0;
  padding:0;

  border:3px solid #ff3333;

  background:rgba(
    255,
    50,
    50,
    .18
  );

  min-width:0;
  min-height:0;

  touch-action:none;

  user-select:none;
}

.mask.selected{
  box-shadow:
    0 0 0 3px
    rgba(
      2,
      133,
      255,
      .35
    );
}

/*
  サイズ変更用
*/
.resize-handle{
  position:absolute;

  right:-9px;
  bottom:-9px;

  width:18px;
  height:18px;

  border:3px solid #0285FF;

  border-radius:50%;

  background:#fff;

  touch-action:none;
}

/* =========================
   解答画面
========================= */

.answer{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
}

.answer-image{
  display:block;
  width:100%;
  height:auto;
}

.answer-mask{
  position:absolute;

  margin:0;
  padding:0;

  border:3px solid #ff3333;

  background:#ff3333;

  touch-action:none;
}

.answer-mask.revealed{
  opacity:0;
}

/* =========================
   下部操作
========================= */

.bottom-bar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:100;

  display:flex;

  gap:10px;

  padding:
    10px
    16px
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  background:#fff;

  border-top:
    1px solid
    #e5e5e5;
}

.bottom-bar button{
  flex:1;
}

/* =========================
   トースト
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:85px;

  z-index:300;

  transform:
    translateX(-50%);

  padding:
    10px 16px;

  border-radius:20px;

  background:#111;
  color:#fff;

  white-space:nowrap;

  font-size:14px;
}

/* =========================
   エラー表示
========================= */

.error-box{
  margin-top:20px;

  padding:16px;

  border:
    1px solid
    #ffcccc;

  border-radius:14px;

  background:#fff5f5;

  color:#b00020;
}

/* =========================
   非表示
========================= */

.hidden{
  display:none !important;
}

</style>

</head>

<body>

<div id="app"></div>

<script>

"use strict";

/* =================================================
   保存データ
================================================= */

const STORAGE_KEY =
  "test_prep_mobile_v2";

/*
  旧バージョンのデータも
  読み込めるようにしておく
*/
const OLD_STORAGE_KEY =
  "test_prep_mobile_v1";

let db = {

  tests:[],

  fixedId:null

};

let state = {

  screen:"home",

  testId:null,

  problemId:null,

  editImage:null,

  masks:[],

  selectedMask:null,

  answerIndex:0

};
  /* =================================================
   基本関数
================================================= */

function $(id){

  return document.getElementById(id);

}

function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(char){

      const map = {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      };

      return map[char];

    }
  );

}

function showToast(message){

  const old =
    document.querySelector(
      ".toast"
    );

  if(old){

    old.remove();

  }

  const toast =
    document.createElement(
      "div"
    );

  toast.className =
    "toast";

  toast.textContent =
    message;

  document.body.appendChild(
    toast
  );

  setTimeout(
    function(){

      if(toast.parentNode){

        toast.remove();

      }

    },
    1600
  );

}

/* =================================================
   データ読み込み
================================================= */

function normalizeDB(data){

  if(
    !data ||
    !Array.isArray(data.tests)
  ){

    return {
      tests:[],
      fixedId:null
    };

  }

  data.tests.forEach(
    function(test){

      if(!test.id){

        test.id =
          uid();

      }

      if(
        typeof test.name !==
        "string"
      ){

        test.name =
          "無題のテスト";

      }

      if(
        !Array.isArray(
          test.problems
        )
      ){

        test.problems = [];

      }

      test.problems.forEach(
        function(problem){

          if(!problem.id){

            problem.id =
              uid();

          }

          if(
            typeof problem.image !==
            "string"
          ){

            problem.image =
              "";

          }

          if(
            !Array.isArray(
              problem.masks
            )
          ){

            problem.masks = [];

          }

          problem.masks.forEach(
            function(mask){

              if(!mask.id){

                mask.id =
                  uid();

              }

              mask.x =
                Number(mask.x) || 0;

              mask.y =
                Number(mask.y) || 0;

              mask.w =
                Number(mask.w) || 0;

              mask.h =
                Number(mask.h) || 0;

            }
          );

          if(
            !problem.revealed ||
            typeof problem.revealed !==
            "object"
          ){

            problem.revealed = {};

          }

        }
      );

    }
  );

  return {

    tests:data.tests,

    fixedId:
      data.fixedId || null

  };

}

/* =================================================
   IndexedDB 保存システム
================================================= */

const DB_NAME =
  "TestPrepApp";

const DB_VERSION =
  1;

const DB_STORE =
  "appData";

let idb = null;


/* -------------------------------
   IndexedDBを開く
-------------------------------- */

function openDatabase(){

  return new Promise(
    function(resolve,reject){

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );

      request.onupgradeneeded =
        function(event){

          const database =
            event.target.result;

          if(
            !database.objectStoreNames.contains(
              DB_STORE
            )
          ){

            database.createObjectStore(
              DB_STORE
            );

          }

        };

      request.onsuccess =
        function(){

          idb =
            request.result;

          resolve(idb);

        };

      request.onerror =
        function(){

          reject(
            request.error
          );

        };

    }
  );

}


/* -------------------------------
   IndexedDBへ保存
-------------------------------- */

async function saveDB(){

  try{

    if(!idb){

      await openDatabase();

    }

    await new Promise(
      function(resolve,reject){

        const transaction =
          idb.transaction(
            DB_STORE,
            "readwrite"
          );

        const store =
          transaction.objectStore(
            DB_STORE
          );

        const request =
          store.put(
            db,
            "main"
          );

        request.onsuccess =
          function(){

            resolve();

          };

        request.onerror =
          function(){

            reject(
              request.error
            );

          };

      }
    );

    return true;

  }catch(error){

    console.error(
      "IndexedDB保存エラー:",
      error
    );

    showToast(
      "保存に失敗しました"
    );

    return false;

  }

}


/* -------------------------------
   IndexedDBから読み込み
-------------------------------- */

async function loadDB(){

  try{

    await openDatabase();

    const saved =
      await new Promise(
        function(resolve,reject){

          const transaction =
            idb.transaction(
              DB_STORE,
              "readonly"
            );

          const store =
            transaction.objectStore(
              DB_STORE
            );

          const request =
            store.get(
              "main"
            );

          request.onsuccess =
            function(){

              resolve(
                request.result
              );

            };

          request.onerror =
            function(){

              reject(
                request.error
              );

            };

        }
      );

    if(saved){

      db =
        normalizeDB(
          saved
        );

      return;

    }

    /*
      古いlocalStorageデータがあれば
      IndexedDBへ移行
    */

    try{

      const oldData =
        localStorage.getItem(
          STORAGE_KEY
        );

      if(oldData){

        db =
          normalizeDB(
            JSON.parse(
              oldData
            )
          );

        await saveDB();

        localStorage.removeItem(
          STORAGE_KEY
        );

        return;

      }

    }catch(error){

      console.warn(
        "旧データ移行失敗:",
        error
      );

    }

    try{

      const oldV1 =
        localStorage.getItem(
          OLD_STORAGE_KEY
        );

      if(oldV1){

        db =
          normalizeDB(
            JSON.parse(
              oldV1
            )
          );

        await saveDB();

        localStorage.removeItem(
          OLD_STORAGE_KEY
        );

        return;

      }

    }catch(error){

      console.warn(
        "v1データ移行失敗:",
        error
      );

    }

    db = {

      tests:[],

      fixedId:null

    };

  }catch(error){

    console.error(
      "IndexedDB読み込みエラー:",
      error
    );

    db = {

      tests:[],

      fixedId:null

    };

    showToast(
      "保存データを読み込めませんでした"
    );

  }

            }

/* =================================================
   現在のテスト・問題
================================================= */

function getTest(){

  return (
    db.tests.find(
      function(test){

        return (
          test.id ===
          state.testId
        );

      }
    ) || null
  );

}

function getProblem(){

  const test =
    getTest();

  if(!test){

    return null;

  }

  return (
    test.problems.find(
      function(problem){

        return (
          problem.id ===
          state.problemId
        );

      }
    ) || null
  );

}

/* =================================================
   画面移動
================================================= */

function go(screen){

  state.screen =
    screen;

  render();

  window.scrollTo(
    0,
    0
  );

}

/* =================================================
   テスト作成
================================================= */

function createTest(){

  const test = {

    id:uid(),

    name:"新しいテスト",

    problems:[]

  };

  db.tests.push(
    test
  );

  state.testId =
    test.id;

  state.problemId =
    null;

  state.editImage =
    null;

  state.masks =
    [];

  state.selectedMask =
    null;

  saveDB();

  go("create");

}

/* =================================================
   問題追加
================================================= */

function addProblem(){

  const test =
    getTest();

  if(!test){

    showToast(
      "テストが選択されていません"
    );

    return;

  }

  const problem = {

    id:uid(),

    image:"",

    masks:[],

    revealed:{}

  };

  test.problems.push(
    problem
  );

  state.problemId =
    problem.id;

  state.editImage =
    null;

  state.masks =
    [];

  state.selectedMask =
    null;

  saveDB();

  go("edit");

}

/* =================================================
   問題編集
================================================= */

function openProblem(id){

  const test =
    getTest();

  if(!test){

    return;

  }

  const problem =
    test.problems.find(
      function(item){

        return (
          item.id === id
        );

      }
    );

  if(!problem){

    showToast(
      "問題が見つかりません"
    );

    return;

  }

  state.problemId =
    problem.id;

  state.editImage =
    problem.image ||
    null;

  state.masks =
    JSON.parse(
      JSON.stringify(
        problem.masks || []
      )
    );

  state.selectedMask =
    null;

  go("edit");

}

/* =================================================
   問題削除
================================================= */

function deleteProblem(id){

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "この問題を削除しますか？"
    )
  ){

    return;

  }

  test.problems =
    test.problems.filter(
      function(problem){

        return (
          problem.id !== id
        );

      }
    );

  if(
    state.problemId === id
  ){

    state.problemId =
      null;

    state.editImage =
      null;

    state.masks =
      [];

    state.selectedMask =
      null;

  }

  saveDB();

  render();

}

/* =================================================
   テスト削除
================================================= */

function deleteTest(){

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "このテストを削除しますか？\n\nこの操作は元に戻せません。"
    )
  ){

    return;

  }

  db.tests =
    db.tests.filter(
      function(item){

        return (
          item.id !== test.id
        );

      }
    );

  if(
    db.fixedId ===
    test.id
  ){

    db.fixedId =
      null;

  }

  state.testId =
    null;

  state.problemId =
    null;

  state.editImage =
    null;

  state.masks =
    [];

  state.selectedMask =
    null;

  saveDB();

  go("home");

}
  /* =================================================
   共通ヘッダー
================================================= */

function header(title, rightHTML = ""){

  return `
    <header class="header">

      <h1>
        ${escapeHTML(title)}
      </h1>

      <div>
        ${rightHTML}
      </div>

    </header>
  `;

}

/* =================================================
   ホーム画面
================================================= */

function renderHome(){

  let html = "";

  if(db.tests.length === 0){

    html = `
      <div class="card muted">

        まだテストがありません。<br>
        「＋ テスト作成」から作成してください。

      </div>
    `;

  }else{

    html =
      db.tests.map(
        function(test){

          const isFixed =
            db.fixedId === test.id;

          return `
            <div class="card test-card">

              <div class="test-title">

                ${escapeHTML(
                  test.name
                )}

                ${
                  isFixed
                  ? `
                    <span class="fixed-badge">
                      固定中
                    </span>
                  `
                  : ""
                }

              </div>

              <div
                class="small muted"
                style="margin-bottom:12px">

                ${test.problems.length}問

              </div>

              <div class="row">

                <button
                  class="blue play-test"
                  data-id="${test.id}">

                  解答する

                </button>

                <button
                  class="textbtn settings-test"
                  data-id="${test.id}">

                  設定

                </button>

              </div>

            </div>
          `;

        }
      ).join("");

  }

  return `

    <div class="app">

      ${header(
        "テスト前対策アプリ",
        `
          <button
            class="primary"
            id="new-test">

            ＋ テスト作成

          </button>
        `
      )}

      ${html}

    </div>

  `;

}

/* =================================================
   問題一覧を作る
================================================= */

function problemListHTML(test){

  if(
    !test ||
    test.problems.length === 0
  ){

    return `
      <div class="card muted">

        まだ問題がありません。

      </div>
    `;

  }

  return test.problems
    .map(
      function(problem,index){

        return `

          <div
            class="problem-row"
            data-problem-id="${problem.id}">

            <!--
              ここだけ長押しして
              並び替える
            -->

            <div
              class="sort-handle"
              data-sort-id="${problem.id}">

              ☰

            </div>

            <div class="problem-number">

              ${index + 1}問目

            </div>

            <div class="spacer">

              <div class="problem-status">

                ${
                  problem.image
                  ? "画像あり"
                  : "画像未設定"
                }

              </div>

            </div>

            <div class="problem-actions">

              <button
                class="textbtn edit-problem"
                data-id="${problem.id}">

                編集

              </button>

              <button
                class="textbtn danger delete-problem"
                data-id="${problem.id}">

                削除

              </button>

            </div>

          </div>

        `;

      }
    )
    .join("");

}

/* =================================================
   テスト作成画面
================================================= */

function renderCreate(){

  const test =
    getTest();

  if(!test){

    return `
      <div class="app">

        ${header(
          "テスト作成"
        )}

        <div class="card">

          テストが見つかりません。

        </div>

        <button
          class="blue"
          id="back-home">

          ホームへ戻る

        </button>

      </div>
    `;

  }

  return `

    <div class="app">

      ${header(
        "テスト作成",
        `
          <button
            class="blue"
            id="add-problem">

            ＋ 問題追加

          </button>
        `
      )}

      <div class="section">

        <label class="small muted">

          テスト名

        </label>

        <input
          id="test-name"
          type="text"
          value="${escapeHTML(
            test.name
          )}"
        >

      </div>

      <div class="section">

        <div class="small muted">

          問題一覧

        </div>

        <div id="problem-list">

          ${problemListHTML(
            test
          )}

        </div>

      </div>

      <div class="section">

        <button
          class="blue"
          id="save-create">

          保存してホームへ

        </button>

      </div>

    </div>

  `;

}

/* =================================================
   設定画面
================================================= */

function renderSettings(){

  const test =
    getTest();

  if(!test){

    return `
      <div class="app">

        ${header(
          "テスト設定"
        )}

        <div class="card">

          テストが見つかりません。

        </div>

        <button
          class="blue"
          id="back-home">

          ホームへ戻る

        </button>

      </div>
    `;

  }

  return `

function readImage(file){

  if(!file){

    return;

  }

  if(
    !file.type ||
    !file.type.startsWith(
      "image/"
    )
  ){

    showToast(
      "画像ファイルを選択してください"
    );

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(){

      state.editImage =
        reader.result;

      state.masks =
        [];

      state.selectedMask =
        null;

      render();

    };

  reader.onerror =
    function(){

      showToast(
        "画像を読み込めませんでした"
      );

    };

  reader.readAsDataURL(
    file
  );

}

/* =================================================
   赤枠の移動・サイズ変更
================================================= */

function setupMaskControls(){

  const editor =
    $("editor");

  if(!editor){

    return;

  }

  const maskElements =
    editor.querySelectorAll(
      ".mask"
    );

  maskElements.forEach(
    function(element){

      const id =
        element.dataset.maskId;

      const mask =
        state.masks.find(
          function(item){

            return (
              item.id === id
            );

          }
        );

      if(!mask){

        return;

      }

      /*
        赤枠をタップしたら選択
      */

      element.addEventListener(
        "pointerdown",
        function(event){

          if(
            event.target.closest(
              ".resize-handle"
            )
          ){

            return;

          }

          event.preventDefault();
          event.stopPropagation();

          state.selectedMask =
            id;

          const rect =
            editor.getBoundingClientRect();

          const startX =
            event.clientX;

          const startY =
            event.clientY;

          const originalX =
            mask.x;

          const originalY =
            mask.y;

          function move(ev){

            const dx =
              (
                ev.clientX -
                startX
              ) /
              rect.width *
              100;

            const dy =
              (
                ev.clientY -
                startY
              ) /
              rect.height *
              100;

            mask.x =
              Math.max(
                0,
                Math.min(
                  100 - mask.w,
                  originalX + dx
                )
              );

            mask.y =
              Math.max(
                0,
                Math.min(
                  100 - mask.h,
                  originalY + dy
                )
              );

            element.style.left =
              mask.x + "%";

            element.style.top =
              mask.y + "%";

          }

          function end(){

            element.removeEventListener(
              "pointermove",
              move
            );

            element.removeEventListener(
              "pointerup",
              end
            );

            element.removeEventListener(
              "pointercancel",
              end
            );

          }

          element.addEventListener(
            "pointermove",
            move
          );

          element.addEventListener(
            "pointerup",
            end
          );

          element.addEventListener(
            "pointercancel",
            end
          );

        }
      );

      /*
        サイズ変更
      */

      const handle =
        element.querySelector(
          ".resize-handle"
        );

      if(!handle){

        return;

      }

      handle.addEventListener(
        "pointerdown",
        function(event){

          event.preventDefault();
          event.stopPropagation();

          const rect =
            editor.getBoundingClientRect();

          const startX =
            event.clientX;

          const startY =
            event.clientY;

          const originalW =
            mask.w;

          const originalH =
            mask.h;

          function resize(ev){

            const dx =
              (
                ev.clientX -
                startX
              ) /
              rect.width *
              100;

            const dy =
              (
                ev.clientY -
                startY
              ) /
              rect.height *
              100;

            mask.w =
              Math.max(
                0.1,
                Math.min(
                  100 - mask.x,
                  originalW + dx
                )
              );

            mask.h =
              Math.max(
                0.1,
                Math.min(
                  100 - mask.y,
                  originalH + dy
                )
              );

            element.style.width =
              mask.w + "%";

            element.style.height =
              mask.h + "%";

          }

          function end(){

            handle.removeEventListener(
              "pointermove",
              resize
            );

            handle.removeEventListener(
              "pointerup",
              end
            );

            handle.removeEventListener(
              "pointercancel",
              end
            );

          }

          handle.addEventListener(
            "pointermove",
            resize
          );

          handle.addEventListener(
            "pointerup",
            end
          );

          handle.addEventListener(
            "pointercancel",
            end
          );

        }
      );

    }
  );

}

                width:${mask.w}%;
                height:${mask.h}%;

            state.answerIndex ===
            test.problems.length - 1
            ? "終了"
            : "次へ →"
          }

/* =================================================
   並び替え
   スマホ：☰を長押し
================================================= */

function setupSorting(){

  const list =
    $("problem-list");

  const settingsList =
    $("settings-problem-list");

  /*
    作成画面・設定画面の
    どちらでも使える
  */

  [
    list,
    settingsList
  ].forEach(
    function(container){

      if(!container){

        return;

      }

      const rows =
        container.querySelectorAll(
          ".problem-row"
        );

      rows.forEach(
        function(row){

          const handle =
            row.querySelector(
              ".sort-handle"
            );

          if(!handle){

            return;

          }

          let timer =
            null;

          let dragging =
            false;

          let pointerId =
            null;

          /*
            長押し開始
          */

          handle.addEventListener(
            "pointerdown",
            function(event){

              event.preventDefault();

              pointerId =
                event.pointerId;

              try{

                handle.setPointerCapture(
                  pointerId
                );

              }catch(error){}

              timer =
                setTimeout(
                  function(){

                    dragging =
                      true;

                    row.classList.add(
                      "dragging"
                    );

                    if(
                      navigator.vibrate
                    ){

                      navigator.vibrate(
                        40
                      );

                    }

                  },
                  350
                );

            }
          );

          /*
            指を動かす
          */

          handle.addEventListener(
            "pointermove",
            function(event){

              if(!dragging){

                return;

              }

              event.preventDefault();

              const allRows =
                [
                  ...container.querySelectorAll(
                    ".problem-row"
                  )
                ].filter(
                  function(item){

                    return item !== row;

                  }
                );

              let target =
                null;

              for(
                const other
                of allRows
              ){

                const rect =
                  other.getBoundingClientRect();

                const center =
                  rect.top +
                  rect.height / 2;

                if(
                  event.clientY <
                  center
                ){

                  target =
                    other;

                  break;

                }

              }

              if(target){

                container.insertBefore(
                  row,
                  target
                );

              }else if(
                allRows.length > 0
              ){

                container.appendChild(
                  row
                );

              }

            }
          );

          /*
            指を離す
          */

          function finish(){

            clearTimeout(
              timer
            );

            if(dragging){

              row.classList.remove(
                "dragging"
              );

              saveOrderFromContainer(
                container
              );

            }

            dragging =
              false;

            pointerId =
              null;

          }

          handle.addEventListener(
            "pointerup",
            finish
          );

          handle.addEventListener(
            "pointercancel",
            finish
          );

        }
      );

    }
  );

}

/* =================================================
   並び順保存
================================================= */

function saveOrderFromContainer(
  container
){

  const test =
    getTest();

  if(!test){

    return;

  }

  const ids =
    [
      ...container.querySelectorAll(
        ".problem-row"
      )
    ].map(
      function(row){

        return row.dataset.problemId;

      }
    );

  const map =
    new Map(
      test.problems.map(
        function(problem){

          return [
            problem.id,
            problem
          ];

        }
      )
    );

  const newProblems =
    [];

  ids.forEach(
    function(id){

      if(map.has(id)){

        newProblems.push(
          map.get(id)
        );

      }

    }
  );

  /*
    念のため、一覧にない問題を
    消さない
  */

  test.problems.forEach(
    function(problem){

      if(
        !newProblems.includes(
          problem
        )
      ){

        newProblems.push(
          problem
        );

      }

    }
  );

  test.problems =
    newProblems;

  saveDB();

  showToast(
    "並び順を保存しました"
  );

}

        }

        test.name =
          settingName.value.trim() ||
          "無題のテスト";

        saveDB();

      };

  }

  /* =========================
     設定：固定
  ========================= */

  const fixed =
    $("fixed-test");

  if(fixed){

    fixed.onchange =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        if(fixed.checked){

          db.fixedId =
            test.id;

        }else if(
          db.fixedId ===
          test.id
        ){

          db.fixedId =
            null;

        }

        saveDB();

        render();

      };

  }

  /* =========================
     設定：削除
  ========================= */

  const deleteTestButton =
    $("delete-test");

  if(deleteTestButton){

    deleteTestButton.onclick =
      deleteTest;

  }

  /* =========================
     ホーム
  ========================= */

  const settingsHome =
    $("settings-home");

  if(settingsHome){

    settingsHome.onclick =
      function(){

        go("home");

      };

  }

  const backHome =
    $("back-home");

  if(backHome){

    backHome.onclick =
      function(){

        go("home");

      };

  }

  /* =========================
     問題編集：画像
  ========================= */

  const pickImage =
    $("pick-image");

  const imageInput =
    $("image-input");

  if(
    pickImage &&
    imageInput
  ){

    pickImage.onclick =
      function(){

        imageInput.click();

      };

    imageInput.onchange =
      function(){

        const file =
          imageInput.files &&
          imageInput.files[0];

        if(file){

          readImage(
            file
          );

        }

      };

  }

  /* =========================
     赤枠追加
  ========================= */

  const addMaskButton =
    $("add-mask");

  if(addMaskButton){

    addMaskButton.onclick =
      addMask;

  }

  /* =========================
     赤枠選択
  ========================= */

  document
    .querySelectorAll(
      "[data-select-mask]"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            selectMask(
              button.dataset.selectMask
            );

          };

      }
    );

  /* =========================
     赤枠削除
  ========================= */

  document
    .querySelectorAll(
      "[data-delete-mask]"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            deleteMask(
              button.dataset.deleteMask
            );

          };

      }
    );

  /* =========================
     問題保存
  ========================= */

  const saveProblemButton =
    $("save-problem");

  if(saveProblemButton){

    saveProblemButton.onclick =
      function(){

        saveProblem();

        go("settings");

      };

  }

  /* =========================
     保存して次の問題
  ========================= */

  const saveAndAdd =
    $("save-and-add");

  if(saveAndAdd){

    saveAndAdd.onclick =
      saveAndAddProblem;

  }

  /* =========================
     編集画面から戻る
  ========================= */

  const editBack =
    $("edit-back");

  if(editBack){

    editBack.onclick =
      function(){

        saveDB();

        go("settings");

      };

  }

  /* =========================
     現在の問題削除
  ========================= */

  const deleteCurrentButton =
    $("delete-current");

  if(deleteCurrentButton){

    deleteCurrentButton.onclick =
      deleteCurrent;

  }

  /* =========================
     解答画面
  ========================= */

  const playHome =
    $("play-home");

  if(playHome){

    playHome.onclick =
      function(){

        go("home");

      };

  }

  const answerPrev =
    $("answer-prev");

  if(answerPrev){

    answerPrev.onclick =
      function(){

        if(
          state.answerIndex > 0
        ){

          state.answerIndex--;

          render();

        }

      };

  }

  const answerNext =
    $("answer-next");

  if(answerNext){

    answerNext.onclick =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        if(
          state.answerIndex <
          test.problems.length - 1
        ){

          state.answerIndex++;

          render();

        }else{

          go("home");

        }

      };

  }

  /*
    赤枠をタップして答えを表示
  */

  document
    .querySelectorAll(
      ".answer-mask"
    )
    .forEach(
      function(mask){

        mask.onclick =
          function(){

            const test =
              getTest();

            if(!test){

              return;

            }

            const problem =
              test.problems[
                state.answerIndex
              ];

            if(!problem){

              return;

            }

            if(
              !problem.revealed
            ){

              problem.revealed =
                {};

            }

            problem.revealed[
              mask.dataset.maskId
            ] = true;

            saveDB();

            render();

          };

      }
    );

  /*
    赤枠編集操作
  */

  setupMaskControls();

  /*
    並び替え
  */

  setupSorting();

}

/* =================================================
   画面描画
================================================= */

function render(){

  const app =
    $("app");

  if(!app){

    return;

  }

  try{

    switch(
      state.screen
    ){

      case "home":

        app.innerHTML =
          renderHome();

        break;

      case "create":

        app.innerHTML =
          renderCreate();

        break;

      case "settings":

        app.innerHTML =
          renderSettings();

        break;

      case "edit":

        app.innerHTML =
          renderEdit();

        break;

      case "play":

        app.innerHTML =
          renderPlay();

        break;

      default:

        state.screen =
          "home";

        app.innerHTML =
          renderHome();

    }

    bindEvents();

  }catch(error){

    console.error(
      error
    );

    app.innerHTML = `

      <div class="app">

        <h1>
          エラーが発生しました
        </h1>

        <div class="error-box">

          ${escapeHTML(
            error.message
          )}

        </div>

        <button
          class="blue"
          style="margin-top:16px"
          onclick="location.reload()">

          再読み込み

        </button>

      </div>

    `;

  }

}

/* =================================================
   起動処理
================================================= */

function start(){

  loadDB();

  /*
    固定されたテストがあれば、
    サイトを開いた瞬間に開始する。

    ただし問題が0問なら
    ホーム画面を表示。
  */

  if(db.fixedId){

    const fixedTest =
      db.tests.find(
        function(test){

          return (
            test.id ===
            db.fixedId
          );

        }
      );

    if(
      fixedTest &&
      fixedTest.problems.length > 0
    ){

      state.testId =
        fixedTest.id;

      state.answerIndex =
        0;

      fixedTest.problems.forEach(
        function(problem){

          problem.revealed = {};

        }
      );

      saveDB();

      state.screen =
        "play";

    }else{

      state.screen =
        "home";

    }

  }else{

    state.screen =
      "home";

  }

  render();

}

/* ==========================================
  アプリ開始
================================================= */

start();

</script>

</body>
</html>
