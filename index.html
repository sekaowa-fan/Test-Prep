<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0285FF">
<title>テスト前対策アプリ</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#fff;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  padding:16px 16px 100px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:23px;
}

.primary,
.blue{
  background:#0285FF;
  color:white;
  border-radius:12px;
  padding:12px 16px;
  font-weight:700;
}

.textbtn{
  background:none;
  color:#0285FF;
  padding:9px;
  font-weight:700;
}

.danger{
  color:#e53935;
}

.card{
  border:1px solid #e2e7ec;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  background:#fff;
}

.test-name{
  font-size:20px;
  font-weight:800;
  margin-bottom:12px;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.spacer{
  flex:1;
}

.muted{
  color:#777;
}

.small{
  font-size:13px;
}

.section{
  margin:22px 0;
}

input[type=text]{
  width:100%;
  margin-top:6px;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:12px;
  outline:none;
}

input[type=text]:focus{
  border-color:#0285FF;
}

.problem-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #e2e7ec;
  border-radius:13px;
  background:#fff;
}

.drag{
  color:#777;
  font-size:23px;
  cursor:grab;
  user-select:none;
  touch-action:none;
}

.problem-title{
  font-weight:700;
}

.drop-target{
  border:2px dashed #0285FF;
}

.hidden{
  display:none!important;
}

/* =========================
   問題編集
========================= */

.editor-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#f2f3f5;
  touch-action:none;
  user-select:none;
}

.editor-img{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
}

.mask{
  position:absolute;
  border:3px solid #ff3333;
  background:#ff3b3038;
  min-width:25px;
  min-height:25px;
  touch-action:none;
}

.mask.selected{
  box-shadow:0 0 0 3px #0285FF55;
}

.resize-handle{
  position:absolute;
  right:-10px;
  bottom:-10px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#fff;
  border:3px solid #0285FF;
  touch-action:none;
}

.mask-tools{
  margin-top:12px;
}

/* =========================
   解答画面
========================= */

.answer-wrap{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
}

.answer-img{
  display:block;
  width:100%;
  height:auto;
}

.answer-mask{
  position:absolute;
  background:#ff3030;
  border:3px solid #ff3030;
  cursor:pointer;
}

.answer-mask.revealed{
  background:transparent;
  border-color:transparent;
  pointer-events:none;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px max(16px,calc((100vw - 760px)/2 + 16px));
  background:white;
  border-top:1px solid #e5e5e5;
  z-index:50;
}

.bottom button{
  flex:1;
}

/* =========================
   モーダル
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#0007;
}

.modal-box{
  width:min(500px,100%);
  max-height:85vh;
  overflow:auto;
  padding:20px;
  border-radius:18px;
  background:white;
}

.modal-box h3{
  margin-top:0;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-buttons button{
  flex:1;
}

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  z-index:200;
  padding:10px 16px;
  border-radius:20px;
  background:#111;
  color:#fff;
  white-space:nowrap;
}

/* 並び替え中 */
.dragging{
  opacity:.45;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================
   データ
========================================= */

const STORAGE_KEY = "test_before_app_v3";

let db;

try{
  db = JSON.parse(
    localStorage.getItem(STORAGE_KEY) ||
    '{"tests":[],"fixedId":null}'
  );
}catch(e){
  db = {tests:[],fixedId:null};
}

if(!Array.isArray(db.tests)){
  db.tests = [];
}

let state = {
  screen:"home",
  testId:null,
  problemId:null,

  editImage:null,
  masks:[],
  selectedMask:null,

  answerIndex:0
};

/* =========================================
   基本関数
========================================= */

const $ = id => document.getElementById(id);

function uid(){
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2,9);
}

function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,function(c){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c];
  });
}

function getTest(){
  return db.tests.find(t => t.id === state.testId);
}

function getProblem(){
  const t = getTest();
  if(!t) return null;

  return t.problems.find(
    p => p.id === state.problemId
  );
}

function showToast(text){
  const old = document.querySelector(".toast");
  if(old) old.remove();

  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;

  document.body.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },1500);
}

function go(screen){
  state.screen = screen;
  render();
  window.scrollTo(0,0);
}

/* =========================================
   画面描画
========================================= */

function render(){

  const app = $("app");

  if(!app) return;

  if(state.screen === "home"){
    app.innerHTML = renderHome();
  }

  else if(state.screen === "create"){
    app.innerHTML = renderCreate();
  }

  else if(state.screen === "edit"){
    app.innerHTML = renderEdit();
  }

  else if(state.screen === "settings"){
    app.innerHTML = renderSettings();
  }

  else if(state.screen === "play"){
    app.innerHTML = renderPlay();
  }

  bindEvents();
}

/* =========================================
   ヘッダー
========================================= */

function header(title,rightHTML=""){
  return `
    <header class="header">
      <h1>${title}</h1>
      <div>${rightHTML}</div>
    </header>
  `;
}

/* =========================================
   ホーム
========================================= */

function renderHome(){

  let testsHTML = "";

  if(db.tests.length === 0){

    testsHTML = `
      <div class="card muted">
        まだテストがありません。<br>
        「＋ テスト作成」から作ってみよう！
      </div>
    `;

  }else{

    testsHTML = db.tests.map(t=>{

      const fixed =
        db.fixedId === t.id
        ? `<span class="small" style="color:#0285FF">● 固定中</span>`
        : "";

      return `
        <div class="card">

          <div class="test-name">
            ${escapeHTML(t.name)} ${fixed}
          </div>

          <div class="row">

            <button
              class="blue play-test"
              data-id="${t.id}">
              解答する
            </button>

            <button
              class="textbtn settings-test"
              data-id="${t.id}">
              設定
            </button>

          </div>

        </div>
      `;

    }).join("");
  }

  return `
    <div class="app">

      ${header(
        "テスト前対策アプリ",
        `<button class="primary" id="new-test">＋ テスト作成</button>`
      )}

      ${testsHTML}

    </div>
  `;
}

/* =========================================
   テスト作成
========================================= */

function renderCreate(){

  const t = getTest();

  if(!t){
    return "";
  }

  const problems = t.problems.map((p,index)=>{

    return `
      <div
        class="problem-row"
        draggable="true"
        data-problem-id="${p.id}">

        <span class="drag">☰</span>

        <span class="problem-title">
          ${index+1}問目
        </span>

        <span class="spacer"></span>

        <button
          class="textbtn edit-problem"
          data-id="${p.id}">
          編集
        </button>

        <button
          class="textbtn danger delete-problem"
          data-id="${p.id}">
          削除
        </button>

      </div>
    `;

  }).join("");

  return `
    <div class="app">

      ${header(
        "テスト作成",
        `<button class="blue add-problem">＋ 問題追加</button>`
      )}

      <div class="section">

        <label class="small muted">
          テスト名
        </label>

        <input
          id="test-name"
          type="text"
          value="${escapeHTML(t.name)}">

      </div>

      <div id="problem-list">

        ${
          problems ||
          `<p class="muted">問題を追加してください。</p>`
        }

      </div>

      <div class="section">

        <button
          class="blue"
          id="save-create">
          保存する
        </button>

      </div>

    </div>
  `;
}

/* =========================================
   問題編集
========================================= */

function renderEdit(){

  const p = getProblem();

  if(!p){
    return `
      <div class="app">
        ${header("問題編集")}
        <p>問題が見つかりません。</p>
      </div>
    `;
  }

  let editor = "";

  if(state.editImage){

    const masks = state.masks.map(m=>{

      return `
        <div
          class="mask ${state.selectedMask === m.id ? "selected" : ""}"
          data-mask-id="${m.id}"
          style="
            left:${m.x}%;
            top:${m.y}%;
            width:${m.w}%;
            height:${m.h}%;
          "
        >
          ${
            state.selectedMask === m.id
            ? `<span class="resize-handle"></span>`
            : ""
          }
        </div>
      `;

    }).join("");

    editor = `
      <div
        class="editor-wrap"
        id="editor">

        <img
          id="editor-image"
          class="editor-img"
          src="${state.editImage}">

        ${masks}

      </div>
    `;

  }else{

    editor = `
      <div class="card">

        <button
          class="blue"
          id="pick-image">
          教科書の画像を追加
        </button>

        <input
          id="image-input"
          class="hidden"
          type="file"
          accept="image/*">

      </div>
    `;
  }

  const maskList = state.masks.map((m,index)=>{

    return `
      <div class="card row">

        <b>${index+1}個目</b>

        <span class="spacer"></span>

        <button
          class="textbtn danger delete-mask"
          data-id="${m.id}">
          削除
        </button>

      </div>
    `;

  }).join("");

  return `
    <div class="app">

      ${header(
        "問題編集",
        `<button class="blue" id="save-problem">保存</button>`
      )}

      <div class="small muted" style="margin-bottom:8px">
        赤い枠をドラッグして移動できます。<br>
        青い丸をドラッグすると大きさを変更できます。
      </div>

      ${editor}

      <div class="row mask-tools">

        ${
          state.editImage
          ? `
            <button
              class="blue"
              id="add-mask">
              ＋ 隠す場所を追加
            </button>
          `
          : ""
        }

        <span class="muted small">
          ${state.masks.length}個の隠し場所
        </span>

      </div>

      ${maskList}

      <div class="section">

        <button
          class="blue"
          id="add-problem-from-edit">
          ＋ 問題を追加
        </button>

      </div>

      <div class="section">

        <button
          class="textbtn danger"
          id="delete-current-problem">
          この問題を削除
        </button>

      </div>

    </div>
  `;
}

/* =========================================
   設定
========================================= */

function renderSettings(){

  const t = getTest();

  if(!t){
    return "";
  }

  const list = t.problems.map((p,index)=>{

    return `
      <div class="problem-row">

        <span>
          ${index+1}問目
        </span>

        <span class="spacer"></span>

        <button
          class="textbtn edit-problem"
          data-id="${p.id}">
          編集
        </button>

        <button
          class="textbtn danger delete-problem"
          data-id="${p.id}">
          削除
        </button>

      </div>
    `;

  }).join("");

  return `
    <div class="app">

      ${header(
        "設定",
        `<button class="textbtn back-home">ホーム</button>`
      )}

      <div class="section">

        <label class="small muted">
          テスト名
        </label>

        <input
          id="setting-name"
          type="text"
          value="${escapeHTML(t.name)}">

      </div>

      <div class="card row">

        <input
          id="fixed-test"
          type="checkbox"
          ${db.fixedId === t.id ? "checked" : ""}>

        <label for="fixed-test">
          このテストをトップに固定する
        </label>

      </div>

      <div class="section">

        <h2>問題一覧</h2>

        ${list || `<p class="muted">問題がありません。</p>`}

      </div>

      <div class="section">

        <button
          class="textbtn danger"
          id="delete-test">
          ⚠️ テストを削除
        </button>

      </div>

    </div>
  `;
}

/* =========================================
   解答
========================================= */

function renderPlay(){

  const t = getTest();

  if(!t || !t.problems.length){

    return `
      <div class="app">

        ${header(
          "解答",
          `<button class="textbtn quit">ホーム</button>`
        )}

        <p>問題がありません。</p>

      </div>
    `;
  }

  if(state.answerIndex >= t.problems.length){
    state.answerIndex = 0;
  }

  const p = t.problems[state.answerIndex];

  if(!p.revealed){
    p.revealed = {};
  }

  const masks = p.masks.map(m=>{

    const revealed = p.revealed[m.id] === true;

    return `
      <div
        class="answer-mask ${revealed ? "revealed" : ""}"
        data-mask-id="${m.id}"
        style="
          left:${m.x}%;
          top:${m.y}%;
          width:${m.w}%;
          height:${m.h}%;
        ">
      </div>
    `;

  }).join("");

  return `
    <div class="app">

      ${header(
        `${state.answerIndex+1} / ${t.problems.length}`,
        `<button class="textbtn quit">ホーム</button>`
      )}

      <div class="card">
        <div class="test-name">
          ${escapeHTML(t.name)}
        </div>
      </div>

      <div
        class="answer-wrap">

        <img
          class="answer-img"
          src="${p.image}">

        ${masks}

      </div>

      <div class="bottom">

        <button
          class="blue"
          id="prev">
          ← 前へ
        </button>

        <button
          class="blue"
          id="next">
          次へ →
        </button>

      </div>

    </div>
  `;
}

/* =========================================
   新規テスト
========================================= */

function createTest(){

  const t = {
    id:uid(),
    name:"新しいテスト",
    problems:[]
  };

  db.tests.push(t);
  saveDB();

  state.testId = t.id;

  go("create");
}

/* =========================================
   問題追加
========================================= */

function addProblem(){

  const t = getTest();

  if(!t){
    showToast("テストが見つかりません");
    return;
  }

  const p = {
    id:uid(),
    image:"",
    masks:[],
    revealed:{}
  };

  t.problems.push(p);

  state.problemId = p.id;
  state.editImage = null;
  state.masks = [];
  state.selectedMask = null;

  saveDB();

  go("edit");
}

/* =========================================
   編集画面へ
========================================= */

function openProblem(id){

  const t = getTest();

  if(!t) return;

  const p = t.problems.find(x=>x.id === id);

  if(!p) return;

  state.problemId = id;
  state.editImage = p.image || null;
  state.masks = JSON.parse(
    JSON.stringify(p.masks || [])
  );
  state.selectedMask = null;

  go("edit");
}

/* =========================================
   画像
========================================= */

function readImage(file){

  const reader = new FileReader();

  reader.onload = function(){

    state.editImage = reader.result;

    render();
  };

  reader.readAsDataURL(file);
}

/* =========================================
   問題保存
========================================= */

function saveProblem(){

  const p = getProblem();

  if(!p) return;

  if(!state.editImage){

    showToast("画像を追加してください");

    return;
  }

  p.image = state.editImage;

  p.masks = state.masks.map(m=>({
    id:m.id,
    x:m.x,
    y:m.y,
    w:m.w,
    h:m.h
  }));

  p.revealed = {};

  saveDB();

  go("create");
}

/* =========================================
   問題削除
========================================= */

function deleteProblem(id){

  const t = getTest();

  if(!t) return;

  const p = t.problems.find(x=>x.id === id);

  if(!p) return;

  if(!window.confirm("この問題を削除しますか？")){
    return;
  }

  t.problems =
    t.problems.filter(x=>x.id !== id);

  saveDB();

  if(state.problemId === id){
    state.problemId = null;
  }

  render();
}

/* =========================================
   現在の問題を削除
========================================= */

function deleteCurrentProblem(){

  const t = getTest();

  if(!t) return;

  if(!window.confirm("この問題を削除しますか？")){
    return;
  }

  t.problems =
    t.problems.filter(
      p => p.id !== state.problemId
    );

  saveDB();

  state.problemId = null;

  go("create");
}

/* =========================================
   テスト削除
========================================= */

function deleteTest(){

  const t = getTest();

  if(!t) return;

  if(!window.confirm(
    "このテストを削除しますか？\nこの操作は元に戻せません。"
  )){
    return;
  }

  if(db.fixedId === t.id){
    db.fixedId = null;
  }

  db.tests =
    db.tests.filter(x=>x.id !== t.id);

  saveDB();

  state.testId = null;

  go("home");
}

/* =========================================
   問題並び替え
========================================= */

let dragProblemId = null;

function enableSorting(){

  document
    .querySelectorAll(".problem-row[draggable]")
    .forEach(row=>{

      row.addEventListener("dragstart",function(e){

        dragProblemId =
          row.dataset.problemId;

        row.classList.add("dragging");

        e.dataTransfer.effectAllowed = "move";

      });

      row.addEventListener("dragend",function(){

        row.classList.remove("dragging");

        document
          .querySelectorAll(".problem-row")
          .forEach(x=>{
            x.classList.remove("drop-target");
          });

        dragProblemId = null;

      });

      row.addEventListener("dragover",function(e){

        e.preventDefault();

        if(
          dragProblemId &&
          dragProblemId !== row.dataset.problemId
        ){
          row.classList.add("drop-target");
        }

      });

      row.addEventListener("dragleave",function(){

        row.classList.remove("drop-target");

      });

      row.addEventListener("drop",function(e){

        e.preventDefault();

        row.classList.remove("drop-target");

        const fromId = dragProblemId;
        const toId = row.dataset.problemId;

        if(!fromId || fromId === toId){
          return;
        }

        const t = getTest();

        if(!t) return;

        const fromIndex =
          t.problems.findIndex(
            p=>p.id === fromId
          );

        const toIndex =
          t.problems.findIndex(
            p=>p.id === toId
          );

        if(fromIndex < 0 || toIndex < 0){
          return;
        }

        const moved =
          t.problems.splice(fromIndex,1)[0];

        t.problems.splice(
          toIndex,
          0,
          moved
        );

        saveDB();

        render();

      });

    });
}

/* =========================================
   赤枠操作
========================================= */

function setupMaskControls(){

  const editor = $("editor");

  if(!editor) return;

  document.querySelectorAll(".mask").forEach(el=>{

    const id = el.dataset.maskId;
    const mask = state.masks.find(m => m.id === id);

    if(!mask) return;

    /* -------------------------
       赤枠をタップして選択
    ------------------------- */

    el.addEventListener("pointerdown",function(e){

      if(e.target.classList.contains("resize-handle")){
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      state.selectedMask = id;

      const rect = editor.getBoundingClientRect();

      const startX = e.clientX;
      const startY = e.clientY;

      const startLeft = mask.x;
      const startTop = mask.y;

      el.setPointerCapture(e.pointerId);

      function move(ev){

        const dx =
          (ev.clientX - startX) /
          rect.width * 100;

        const dy =
          (ev.clientY - startY) /
          rect.height * 100;

        mask.x = Math.max(
          0,
          Math.min(
            100 - mask.w,
            startLeft + dx
          )
        );

        mask.y = Math.max(
          0,
          Math.min(
            100 - mask.h,
            startTop + dy
          )
        );

        el.style.left = mask.x + "%";
        el.style.top = mask.y + "%";
      }

      function up(){

        try{
          el.releasePointerCapture(e.pointerId);
        }catch(err){}

        el.removeEventListener(
          "pointermove",
          move
        );

        el.removeEventListener(
          "pointerup",
          up
        );
      }

      el.addEventListener(
        "pointermove",
        move
      );

      el.addEventListener(
        "pointerup",
        up
      );

    });


    /* -------------------------
       サイズ変更
    ------------------------- */

    const handle =
      el.querySelector(".resize-handle");

    if(!handle) return;

    handle.addEventListener(
      "pointerdown",
      function(e){

        e.preventDefault();
        e.stopPropagation();

        state.selectedMask = id;

        const rect =
          editor.getBoundingClientRect();

        const startX = e.clientX;
        const startY = e.clientY;

        const startW = mask.w;
        const startH = mask.h;

        handle.setPointerCapture(
          e.pointerId
        );

        function resize(ev){

          const dx =
            (ev.clientX - startX) /
            rect.width * 100;

          const dy =
            (ev.clientY - startY) /
            rect.height * 100;

          mask.w = Math.max(
            5,
            Math.min(
              100 - mask.x,
              startW + dx
            )
          );

          mask.h = Math.max(
            5,
            Math.min(
              100 - mask.y,
              startH + dy
            )
          );

          el.style.width =
            mask.w + "%";

          el.style.height =
            mask.h + "%";
        }

        function end(){

          try{
            handle.releasePointerCapture(
              e.pointerId
            );
          }catch(err){}

          handle.removeEventListener(
            "pointermove",
            resize
          );

          handle.removeEventListener(
            "pointerup",
            end
          );
        }

        handle.addEventListener(
          "pointermove",
          resize
        );

        handle.addEventListener(
          "pointerup",
          end
        );

      }
    );

  });
}


/* =========================================
   問題並び替え
========================================= */

let dragProblemId = null;

function enableSorting(){

  const rows =
    document.querySelectorAll(
      ".problem-row[draggable='true']"
    );

  rows.forEach(row=>{

    row.addEventListener(
      "dragstart",
      function(e){

        dragProblemId =
          row.dataset.problemId;

        row.classList.add("dragging");

        if(e.dataTransfer){
          e.dataTransfer.effectAllowed = "move";
          e.dataTransfer.setData(
            "text/plain",
            dragProblemId
          );
        }

      }
    );


    row.addEventListener(
      "dragend",
      function(){

        row.classList.remove("dragging");

        document
          .querySelectorAll(".problem-row")
          .forEach(r=>{
            r.classList.remove(
              "drop-target"
            );
          });

        dragProblemId = null;

      }
    );


    row.addEventListener(
      "dragover",
      function(e){

        e.preventDefault();

        if(
          dragProblemId &&
          dragProblemId !==
          row.dataset.problemId
        ){

          row.classList.add(
            "drop-target"
          );

        }

      }
    );


    row.addEventListener(
      "dragleave",
      function(){

        row.classList.remove(
          "drop-target"
        );

      }
    );


    row.addEventListener(
      "drop",
      function(e){

        e.preventDefault();

        row.classList.remove(
          "drop-target"
        );

        let fromId =
          dragProblemId;

        if(!fromId &&
           e.dataTransfer){

          fromId =
            e.dataTransfer.getData(
              "text/plain"
            );

        }

        const toId =
          row.dataset.problemId;

        if(!fromId || !toId) return;

        if(fromId === toId) return;

        const t = getTest();

        if(!t) return;

        const fromIndex =
          t.problems.findIndex(
            p => p.id === fromId
          );

        const toIndex =
          t.problems.findIndex(
            p => p.id === toId
          );

        if(
          fromIndex === -1 ||
          toIndex === -1
        ){
          return;
        }

        const moved =
          t.problems.splice(
            fromIndex,
            1
          )[0];

        t.problems.splice(
          toIndex,
          0,
          moved
        );

        saveDB();

        dragProblemId = null;

        render();

      }
    );

  });

}


/* =========================================
   新規問題を追加
========================================= */

function addProblem(){

  const t = getTest();

  if(!t){

    showToast(
      "テストが見つかりません"
    );

    return;

  }

  const p = {

    id:uid(),

    image:"",

    masks:[],

    revealed:{}

  };

  t.problems.push(p);

  saveDB();

  state.problemId = p.id;

  state.editImage = null;

  state.masks = [];

  state.selectedMask = null;

  go("edit");

}


/* =========================================
   問題を開く
========================================= */

function openProblem(id){

  const t = getTest();

  if(!t) return;

  const p =
    t.problems.find(
      x => x.id === id
    );

  if(!p) return;

  state.problemId = id;

  state.editImage =
    p.image || null;

  state.masks =
    JSON.parse(
      JSON.stringify(
        p.masks || []
      )
    );

  state.selectedMask = null;

  go("edit");

}


/* =========================================
   画像読み込み
========================================= */

function readImage(file){

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(){

    state.editImage =
      reader.result;

    render();

  };

  reader.onerror = function(){

    showToast(
      "画像を読み込めませんでした"
    );

  };

  reader.readAsDataURL(file);

}


/* =========================================
   問題保存
========================================= */

function saveProblem(){

  const p = getProblem();

  if(!p) return;

  if(!state.editImage){

    showToast(
      "画像を追加してください"
    );

    return;

  }

  p.image =
    state.editImage;

  p.masks =
    state.masks.map(m=>({

      id:m.id,

      x:m.x,

      y:m.y,

      w:m.w,

      h:m.h

    }));

  p.revealed = {};

  saveDB();

  go("create");

}


/* =========================================
   問題削除
========================================= */

function deleteProblem(id){

  const t = getTest();

  if(!t) return;

  const index =
    t.problems.findIndex(
      p => p.id === id
    );

  if(index === -1){

    showToast(
      "問題が見つかりません"
    );

    return;

  }

  const confirmed =
    window.confirm(
      "この問題を削除しますか？"
    );

  if(!confirmed) return;

  t.problems.splice(
    index,
    1
  );

  if(state.problemId === id){

    state.problemId = null;

  }

  saveDB();

  render();

}


/* =========================================
   現在編集中の問題を削除
========================================= */

function deleteCurrentProblem(){

  const t = getTest();

  if(!t) return;

  const id =
    state.problemId;

  if(!id) return;

  const index =
    t.problems.findIndex(
      p => p.id === id
    );

  if(index === -1){

    showToast(
      "問題が見つかりません"
    );

    return;

  }

  const confirmed =
    window.confirm(
      "この問題を削除しますか？"
    );

  if(!confirmed) return;

  t.problems.splice(
    index,
    1
  );

  saveDB();

  state.problemId = null;

  state.editImage = null;

  state.masks = [];

  state.selectedMask = null;

  go("create");

}


/* =========================================
   テスト削除
========================================= */

function deleteTest(){

  const t = getTest();

  if(!t) return;

  const confirmed =
    window.confirm(
      "このテストを削除しますか？\n\nこの操作は元に戻せません。"
    );

  if(!confirmed) return;

  const index =
    db.tests.findIndex(
      x => x.id === t.id
    );

  if(index === -1) return;

  db.tests.splice(
    index,
    1
  );

  if(db.fixedId === t.id){

    db.fixedId = null;

  }

  saveDB();

  state.testId = null;

  state.problemId = null;

  state.editImage = null;

  state.masks = [];

  state.selectedMask = null;

  go("home");

}


/* =========================================
   編集画面から問題追加
========================================= */

function addProblemFromEdit(){

  /*
    現在編集中の問題を保存してから
    次の問題を追加する
  */

  const current =
    getProblem();

  if(current){

    if(state.editImage){

      current.image =
        state.editImage;

      current.masks =
        state.masks.map(m=>({

          id:m.id,

          x:m.x,

          y:m.y,

          w:m.w,

          h:m.h

        }));

      current.revealed = {};

    }

  }

  saveDB();

  addProblem();

}


/* =========================================
   現在の編集内容を一時保存
========================================= */

function saveCurrentEditorTemporarily(){

  const p =
    getProblem();

  if(!p) return;

  if(!state.editImage){
    return;
  }

  p.image =
    state.editImage;

  p.masks =
    state.masks.map(m=>({

      id:m.id,

      x:m.x,

      y:m.y,

      w:m.w,

      h:m.h

    }));

  p.revealed = {};

  saveDB();

}


/* =========================================
   すべてのイベントを登録
========================================= */

function bindEvents(){

  /* =========================
     テスト作成
  ========================= */

  const newTestButton =
    $("new-test");

  if(newTestButton){

    newTestButton.onclick =
      function(){

        const t = {

          id:uid(),

          name:"新しいテスト",

          problems:[]

        };

        db.tests.push(t);

        saveDB();

        state.testId = t.id;

        go("create");

      };

  }


  /* =========================
     問題追加
  ========================= */

  document
    .querySelectorAll(".add-problem")
    .forEach(button=>{

      button.onclick =
        function(e){

          e.preventDefault();

          addProblem();

        };

    });


  /* =========================
     編集画面から問題追加
  ========================= */

  const addFromEdit =
    $("add-problem-from-edit");

  if(addFromEdit){

    addFromEdit.onclick =
      function(e){

        e.preventDefault();

        e.stopPropagation();

        addProblemFromEdit();

      };

  }


  /* =========================
     問題編集
  ========================= */

  document
    .querySelectorAll(".edit-problem")
    .forEach(button=>{

      button.onclick =
        function(e){

          e.preventDefault();

          e.stopPropagation();

          openProblem(
            button.dataset.id
          );

        };

    });


  /* =========================
     問題削除
  ========================= */

  document
    .querySelectorAll(".delete-problem")
    .forEach(button=>{

      button.onclick =
        function(e){

          e.preventDefault();

          e.stopPropagation();

          const id =
            button.dataset.id;

          deleteProblem(id);

        };

    });


  /* =========================
     保存
  ========================= */

  const saveCreate =
    $("save-create");

  if(saveCreate){

    saveCreate.onclick =
      function(){

        const t =
          getTest();

        if(!t) return;

        const input =
          $("test-name");

        t.name =
          input.value.trim() ||
          "無題のテスト";

        saveDB();

        go("home");

      };

  }


  /* =========================
     画像選択
  ========================= */

  const pickImage =
    $("pick-image");

  const imageInput =
    $("image-input");

  if(pickImage && imageInput){

    pickImage.onclick =
      function(e){

        e.preventDefault();

        imageInput.click();

      };

    imageInput.onchange =
      function(e){

        const file =
          e.target.files &&
          e.target.files[0];

        if(file){

          readImage(file);

        }

      };

  }


  /* =========================
     問題保存
  ========================= */

  const saveProblemButton =
    $("save-problem");

  if(saveProblemButton){

    saveProblemButton.onclick =
      function(e){

        e.preventDefault();

        saveProblem();

      };

  }


  /* =========================
     隠し場所追加
  ========================= */

  const addMask =
    $("add-mask");

  if(addMask){

    addMask.onclick =
      function(e){

        e.preventDefault();

        if(!state.editImage){

          showToast(
            "先に画像を追加してください"
          );

          return;

        }

        const mask = {

          id:uid(),

          x:30,

          y:30,

          w:30,

          h:15

        };

        state.masks.push(mask);

        state.selectedMask =
          mask.id;

        render();

      };

  }


  /* =========================
     隠し場所削除
  ========================= */

  document
    .querySelectorAll(".delete-mask")
    .forEach(button=>{

      button.onclick =
        function(e){

          e.preventDefault();

          e.stopPropagation();

          const id =
            button.dataset.id;

          state.masks =
            state.masks.filter(
              m => m.id !== id
            );

          if(
            state.selectedMask === id
          ){

            state.selectedMask = null;

          }

          render();

        };

    });


  /* =========================
     現在の問題削除
  ========================= */

  const deleteCurrent =
    $("delete-current-problem");

  if(deleteCurrent){

    deleteCurrent.onclick =
      function(e){

        e.preventDefault();

        e.stopPropagation();

        deleteCurrentProblem();

      };

  }


  /* =========================
     赤枠操作
  ========================= */

  setupMaskControls();


  /* =========================
     並び替え
  ========================= */

  enableSorting();


  /* =========================
     設定 → ホーム
  ========================= */

  document
    .querySelectorAll(".back-home")
    .forEach(button=>{

      button.onclick =
        function(){

          go("home");

        };

    });


  /* =========================
     テスト名変更
  ========================= */

  const settingName =
    $("setting-name");

  if(settingName){

    settingName.onchange =
      function(){

        const t =
          getTest();

        if(!t) return;

        t.name =
          settingName.value.trim() ||
          "無題のテスト";

        saveDB();

      };

  }


  /* =========================
     固定テスト
  ========================= */

  const fixedTest =
    $("fixed-test");

  if(fixedTest){

    fixedTest.onchange =
      function(){

        const t =
          getTest();

        if(!t) return;

        if(fixedTest.checked){

          db.fixedId =
            t.id;

        }else{

          if(
            db.fixedId === t.id
          ){

            db.fixedId = null;

          }

        }

        saveDB();

        render();

      };

  }


  /* =========================
     テスト削除
  ========================= */

  const deleteTestButton =
    $("delete-test");

  if(deleteTestButton){

    deleteTestButton.onclick =
      function(e){

        e.preventDefault();

        e.stopPropagation();

        deleteTest();

      };

  }


  /* =========================
     解答する
  ========================= */

  document
    .querySelectorAll(".play-test")
    .forEach(button=>{

      button.onclick =
        function(e){

          e.preventDefault();

          state.testId =
            button.dataset.id;

          state.answerIndex = 0;

          const t =
            getTest();

          if(!t || !t.problems.length){

            showToast(
              "このテストには問題がありません"
            );

            return;

          }

          t.problems.forEach(p=>{

            p.revealed = {};

          });

          saveDB();

          go("play");

        };

    });


  /* =========================
     解答：赤枠
  ========================= */

  document
    .querySelectorAll(".answer-mask")
    .forEach(mask=>{

      mask.onclick =
        function(e){

          e.preventDefault();

          e.stopPropagation();

          const t =
            getTest();

          if(!t) return;

          const p =
            t.problems[
              state.answerIndex
            ];

          if(!p) return;

          if(!p.revealed){
            p.revealed = {};
          }

          const id =
            mask.dataset.maskId;

          p.revealed[id] =
            !p.revealed[id];

          saveDB();

          render();

        };

    });


  /* =========================
     前へ
  ========================= */

  const prev =
    $("prev");

  if(prev){

    prev.onclick =
      function(){

        if(
          state.answerIndex > 0
        ){

          state.answerIndex--;

          render();

        }

      };

  }


  /* =========================
     次へ
  ========================= */

  const next =
    $("next");

  if(next){

    next.onclick =
      function(){

        const t =
          getTest();

        if(!t) return;

        if(
          state.answerIndex <
          t.problems.length - 1
        ){

          state.answerIndex++;

          render();

        }else{

          go("home");

        }

      };

  }


  /* =========================
     ホームへ
  ========================= */

  document
    .querySelectorAll(".quit")
    .forEach(button=>{

      button.onclick =
        function(){

          go("home");

        };

    });

}


/* =========================================
   起動
========================================= */

function start(){

  state.screen = "home";

  render();

}

start();

</script>
