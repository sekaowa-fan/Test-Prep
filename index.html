<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0285FF">

<title>テスト前対策アプリ</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#fff;
  color:#111;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
input{
  font:inherit;
}

button{
  border:0;
}

.app{
  width:100%;
  min-height:100vh;
  padding:16px 16px 90px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:23px;
  line-height:1.3;
}

.primary,
.blue{
  padding:12px 16px;
  border-radius:12px;
  background:#0285FF;
  color:white;
  font-weight:700;
}

.textbtn{
  padding:9px;
  background:transparent;
  color:#0285FF;
  font-weight:700;
}

.danger{
  color:#e53935;
}

.card{
  margin:12px 0;
  padding:16px;
  border:1px solid #e3e7eb;
  border-radius:16px;
  background:#fff;
}

.row{
  display:flex;
  align-items:center;
  gap:8px;
}

.spacer{
  flex:1;
}

.muted{
  color:#777;
}

.small{
  font-size:13px;
}

.section{
  margin:20px 0;
}

input[type="text"]{
  width:100%;
  margin-top:7px;
  padding:13px;
  border:1px solid #ccd3da;
  border-radius:12px;
  outline:none;
}

input[type="text"]:focus{
  border-color:#0285FF;
}

/* =========================
   問題一覧
========================= */

.problem-row{
  position:relative;
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  min-height:54px;
  margin:8px 0;
  padding:10px 12px;
  border:1px solid #e2e7ec;
  border-radius:13px;
  background:#fff;
  touch-action:none;
}

.problem-row.dragging{
  opacity:.5;
  transform:scale(.98);
}

.problem-row.drag-over{
  border:2px dashed #0285FF;
}

.drag-handle{
  flex:none;
  width:30px;
  text-align:center;
  color:#888;
  font-size:22px;
}

/* =========================
   画像編集
========================= */

.editor{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
  background:#f2f3f5;
  touch-action:none;
  user-select:none;
}

.editor-image{
  display:block;
  width:100%;
  height:auto;
  pointer-events:none;
  user-select:none;
}

.mask{
  position:absolute;
  margin:0;
  padding:0;
  border:3px solid #ff3333;
  background:rgba(255,50,50,.20);
  min-width:0;
  min-height:0;
  touch-action:none;
}

.mask.selected{
  box-shadow:0 0 0 3px rgba(2,133,255,.35);
}

.resize-handle{
  position:absolute;
  right:-10px;
  bottom:-10px;
  width:20px;
  height:20px;
  border:3px solid #0285FF;
  border-radius:50%;
  background:#fff;
  touch-action:none;
}

/* =========================
   解答
========================= */

.answer{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:14px;
}

.answer-image{
  display:block;
  width:100%;
  height:auto;
}

.answer-mask{
  position:absolute;
  margin:0;
  padding:0;
  border:3px solid #ff3333;
  background:#ff3333;
  touch-action:none;
}

.answer-mask.revealed{
  opacity:0;
}

/* =========================
   下部ボタン
========================= */

.bottom-bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  display:flex;
  gap:10px;
  padding:10px 16px;
  background:#fff;
  border-top:1px solid #e5e5e5;
}

.bottom-bar button{
  flex:1;
}

/* =========================
   トースト
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  z-index:300;
  transform:translateX(-50%);
  padding:10px 16px;
  border-radius:20px;
  background:#111;
  color:#fff;
  white-space:nowrap;
}

/* =========================
   非表示
========================= */

.hidden{
  display:none !important;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

"use strict";

/* =================================================
   アプリデータ
================================================= */

const STORAGE_KEY =
  "test_prep_mobile_v1";

let db = {
  tests: [],
  fixedId: null
};

let state = {
  screen: "home",
  testId: null,
  problemId: null,

  editImage: null,
  masks: [],
  selectedMask: null,

  answerIndex: 0
};
  /* =================================================
   基本関数
================================================= */

function $(id){

  return document.getElementById(id);

}

function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    function(char){

      const map = {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      };

      return map[char];

    }
  );

}

function loadDB(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!saved){

      return;

    }

    const parsed =
      JSON.parse(saved);

    if(
      parsed &&
      Array.isArray(parsed.tests)
    ){

      db = parsed;

    }

    if(!Array.isArray(db.tests)){

      db.tests = [];

    }

  }catch(error){

    console.error(
      "データ読み込みエラー",
      error
    );

    db = {

      tests:[],

      fixedId:null

    };

  }

}

function saveDB(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(db)
    );

  }catch(error){

    console.error(
      "データ保存エラー",
      error
    );

    showToast(
      "保存できませんでした"
    );

  }

}

function getTest(){

  return db.tests.find(
    test =>
      test.id === state.testId
  ) || null;

}

function getProblem(){

  const test =
    getTest();

  if(!test){

    return null;

  }

  return test.problems.find(
    problem =>
      problem.id === state.problemId
  ) || null;

}

function showToast(message){

  const old =
    document.querySelector(
      ".toast"
    );

  if(old){

    old.remove();

  }

  const toast =
    document.createElement(
      "div"
    );

  toast.className =
    "toast";

  toast.textContent =
    message;

  document.body.appendChild(
    toast
  );

  setTimeout(
    function(){

      toast.remove();

    },
    1600
  );

}

function go(screen){

  state.screen =
    screen;

  render();

  window.scrollTo(
    0,
    0
  );

}

/* =================================================
   テスト・問題作成
================================================= */

function createTest(){

  const test = {

    id:uid(),

    name:"新しいテスト",

    problems:[]

  };

  db.tests.push(
    test
  );

  state.testId =
    test.id;

  state.problemId =
    null;

  saveDB();

  go("create");

}

function addProblem(){

  const test =
    getTest();

  if(!test){

    return;

  }

  const problem = {

    id:uid(),

    image:"",

    masks:[],

    revealed:{}

  };

  test.problems.push(
    problem
  );

  state.problemId =
    problem.id;

  state.editImage =
    null;

  state.masks = [];

  state.selectedMask =
    null;

  saveDB();

  go("edit");

}

function openProblem(id){

  const test =
    getTest();

  if(!test){

    return;

  }

  const problem =
    test.problems.find(
      p => p.id === id
    );

  if(!problem){

    return;

  }

  state.problemId =
    id;

  state.editImage =
    problem.image ||
    null;

  state.masks =
    JSON.parse(
      JSON.stringify(
        problem.masks || []
      )
    );

  state.selectedMask =
    null;

  go("edit");

  }
  /* =================================================
   ヘッダー
================================================= */

function header(title, rightHTML = ""){

  return `
    <header class="header">

      <h1>
        ${escapeHTML(title)}
      </h1>

      <div>
        ${rightHTML}
      </div>

    </header>
  `;

}

/* =================================================
   ホーム画面
================================================= */

function renderHome(){

  let content = "";

  if(db.tests.length === 0){

    content = `
      <div class="card muted">

        まだテストがありません。<br>
        「＋ テスト作成」から作ってみよう！

      </div>
    `;

  }else{

    const tests =
      [...db.tests].sort(
        function(a,b){

          if(db.fixedId === a.id){

            return -1;

          }

          if(db.fixedId === b.id){

            return 1;

          }

          return 0;

        }
      );

    content =
      tests.map(
        function(test){

          const fixed =
            db.fixedId === test.id
            ? `
              <span
                class="small"
                style="color:#0285FF">
                ● 固定中
              </span>
            `
            : "";

          return `
            <div class="card">

              <div class="test-name">

                ${escapeHTML(test.name)}

                ${fixed}

              </div>

              <div class="row">

                <button
                  class="blue play-test"
                  data-id="${test.id}">
                  解答する
                </button>

                <button
                  class="textbtn settings-test"
                  data-id="${test.id}">
                  設定
                </button>

              </div>

            </div>
          `;

        }
      ).join("");

  }

  return `
    <div class="app">

      ${header(
        "テスト前対策アプリ",
        `
          <button
            class="primary"
            id="new-test">
            ＋ テスト作成
          </button>
        `
      )}

      ${content}

    </div>
  `;

}

/* =================================================
   テスト作成画面
================================================= */

function renderCreate(){

  const test =
    getTest();

  if(!test){

    return `
      <div class="app">

        ${header("テスト作成")}

        <p>
          テストが見つかりません。
        </p>

        <button
          class="blue"
          id="back-home">
          ホームへ戻る
        </button>

      </div>
    `;

  }

  const problems =
    test.problems.map(
      function(problem,index){

        return `
          <div
            class="problem-row"
            data-problem-id="${problem.id}">

            <div class="drag-handle">
              ☰
            </div>

            <div>

              <div
                class="problem-title">
                ${index + 1}問目
              </div>

              <div
                class="small muted">

                ${
                  problem.image
                  ? "画像あり"
                  : "画像未設定"
                }

              </div>

            </div>

            <div class="spacer"></div>

            <button
              class="textbtn edit-problem"
              data-id="${problem.id}">
              編集
            </button>

            <button
              class="textbtn danger delete-problem"
              data-id="${problem.id}">
              削除
            </button>

          </div>
        `;

      }
    ).join("");

  return `
    <div class="app">

      ${header(
        "テスト作成",
        `
          <button
            class="blue"
            id="add-problem">
            ＋ 問題追加
          </button>
        `
      )}

      <div class="section">

        <label
          class="small muted">
          テスト名
        </label>

        <input
          id="test-name"
          type="text"
          value="${escapeHTML(test.name)}">

      </div>

      <div id="problem-list">

        ${
          problems ||
          `
            <div class="card muted">

              まだ問題がありません。<br>
              「＋ 問題追加」から問題を作成してください。

            </div>
          `
        }

      </div>

      <div class="section">

        <button
          class="blue"
          id="save-create">
          保存してホームへ
        </button>

      </div>

    </div>
  `;

}

/* =================================================
   問題編集画面
================================================= */

function renderEdit(){

  const problem =
    getProblem();

  if(!problem){

    return `
      <div class="app">

        ${header("問題編集")}

        <p>
          問題が見つかりません。
        </p>

        <button
          class="blue"
          id="back-create">
          戻る
        </button>

      </div>
    `;

  }

  let imageArea = "";

  if(state.editImage){

    const masks =
      state.masks.map(
        function(mask){

          return `
            <div
              class="mask ${
                state.selectedMask === mask.id
                ? "selected"
                : ""
              }"
              data-mask-id="${mask.id}"
              style="
                left:${mask.x}%;
                top:${mask.y}%;
                width:${mask.w}%;
                height:${mask.h}%;
              ">

              ${
                state.selectedMask === mask.id
                ? `
                  <div
                    class="resize-handle">
                  </div>
                `
                : ""
              }

            </div>
          `;

        }
      ).join("");

    imageArea = `
      <div
        class="editor"
        id="editor">

        <img
          id="editor-image"
          class="editor-image"
          src="${state.editImage}"
          alt="教科書画像">

        ${masks}

      </div>
    `;

  }else{

    imageArea = `
      <div class="card">

        <button
          class="blue"
          id="pick-image">
          📷 教科書の画像を追加
        </button>

        <input
          id="image-input"
          class="hidden"
          type="file"
          accept="image/*">

      </div>
    `;

  }

  const maskList =
    state.masks.map(
      function(mask,index){

        return `
          <div class="card row">

            <span>
              ${index + 1}個目の隠す場所
            </span>

            <span class="spacer"></span>

            <button
              class="textbtn danger delete-mask"
              data-id="${mask.id}">
              削除
            </button>

          </div>
        `;

      }
    ).join("");

  return `
    <div class="app">

      ${header(
        "問題編集",
        `
          <button
            class="blue"
            id="save-problem">
            保存
          </button>
        `
      )}

      <div class="small muted">

        赤枠を指でドラッグすると移動できます。<br>
        青い丸をドラッグすると大きさを変更できます。

      </div>

      <div class="section">

        ${imageArea}

      </div>

      ${
        state.editImage
        ? `
          <div class="section">

            <div class="row">

              <button
                class="blue"
                id="add-mask">
                ＋ 隠す場所を追加
              </button>

              <span
                class="small muted">

                ${state.masks.length}個

              </span>

            </div>

          </div>
        `
        : ""
      }

      ${maskList}

      <div class="section">

        <button
          class="blue"
          id="add-problem-from-edit">
          ＋ 保存して次の問題を追加
        </button>

      </div>

      <div class="section">

        <button
          class="textbtn danger"
          id="delete-current-problem">
          この問題を削除
        </button>

      </div>

    </div>
  `;

}
  /* =================================================
   設定画面
================================================= */

function renderSettings(){

  const test =
    getTest();

  if(!test){

    return `
      <div class="app">

        ${header("設定")}

        <p>
          テストが見つかりません。
        </p>

      </div>
    `;

  }

  return `
    <div class="app">

      ${header(
        "設定",
        `
          <button
            class="textbtn back-home">
            ホーム
          </button>
        `
      )}

      <div class="section">

        <label
          class="small muted">
          テスト名
        </label>

        <input
          id="setting-name"
          type="text"
          value="${escapeHTML(test.name)}">

      </div>

      <div class="card row">

        <input
          id="fixed-test"
          type="checkbox"
          ${
            db.fixedId === test.id
            ? "checked"
            : ""
          }>

        <label for="fixed-test">

          このテストをトップに固定する

        </label>

      </div>

      <div class="card">

        <b>
          問題数
        </b>

        <div class="muted small">

          ${test.problems.length}問

        </div>

      </div>

      <div class="section">

        <button
          class="textbtn danger"
          id="delete-test">

          ⚠️ このテストを削除

        </button>

      </div>

    </div>
  `;

}

/* =================================================
   解答画面
================================================= */

function renderPlay(){

  const test =
    getTest();

  if(
    !test ||
    test.problems.length === 0
  ){

    return `
      <div class="app">

        ${header(
          "解答",
          `
            <button
              class="textbtn quit">
              ホーム
            </button>
          `
        )}

        <div class="card">

          問題がありません。

        </div>

      </div>
    `;

  }

  if(
    state.answerIndex < 0
  ){

    state.answerIndex = 0;

  }

  if(
    state.answerIndex >=
    test.problems.length
  ){

    state.answerIndex =
      test.problems.length - 1;

  }

  const problem =
    test.problems[
      state.answerIndex
    ];

  if(!problem.revealed){

    problem.revealed = {};

  }

  const masks =
    (problem.masks || [])
      .map(
        function(mask){

          const revealed =
            problem.revealed[
              mask.id
            ] === true;

          return `
            <div
              class="answer-mask ${
                revealed
                ? "revealed"
                : ""
              }"
              data-mask-id="${mask.id}"
              style="
                left:${mask.x}%;
                top:${mask.y}%;
                width:${mask.w}%;
                height:${mask.h}%;
              ">
            </div>
          `;

        }
      )
      .join("");

  return `
    <div class="app">

      ${header(
        `${state.answerIndex + 1} / ${test.problems.length}`,
        `
          <button
            class="textbtn quit">
            終了
          </button>
        `
      )}

      <div class="card">

        <div class="test-name">

          ${escapeHTML(test.name)}

        </div>

      </div>

      <div class="answer">

        <img
          class="answer-image"
          src="${problem.image}"
          alt="問題">

        ${masks}

      </div>

      <div class="bottom-bar">

        <button
          class="blue"
          id="prev">

          ← 前へ

        </button>

        <button
          class="blue"
          id="next">

          ${
            state.answerIndex ===
            test.problems.length - 1
            ? "終了"
            : "次へ →"
          }

        </button>

      </div>

    </div>
  `;

}

/* =================================================
   画像読み込み
================================================= */

function readImage(file){

  if(!file){

    return;

  }

  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showToast(
      "画像ファイルを選択してください"
    );

    return;

  }

  const reader =
    new FileReader();

  reader.onload =
    function(){

      state.editImage =
        reader.result;

      render();

    };

  reader.onerror =
    function(){

      showToast(
        "画像を読み込めませんでした"
      );

    };

  reader.readAsDataURL(
    file
  );

}

/* =================================================
   問題保存
================================================= */

function saveProblem(){

  const problem =
    getProblem();

  if(!problem){

    return;

  }

  if(!state.editImage){

    showToast(
      "画像を追加してください"
    );

    return;

  }

  problem.image =
    state.editImage;

  problem.masks =
    state.masks.map(
      function(mask){

        return {

          id:mask.id,

          x:mask.x,

          y:mask.y,

          w:mask.w,

          h:mask.h

        };

      }
    );

  problem.revealed = {};

  saveDB();

  go("create");

}

/* =================================================
   赤枠追加
================================================= */

function addMask(){

  if(!state.editImage){

    showToast(
      "先に画像を追加してください"
    );

    return;

  }

  const mask = {

    id:uid(),

    x:30,

    y:30,

    w:30,

    h:15

  };

  state.masks.push(
    mask
  );

  state.selectedMask =
    mask.id;

  render();

}

/* =================================================
   赤枠操作
================================================= */

function setupMaskControls(){

  const editor =
    $("editor");

  if(!editor){

    return;

  }

  const masks =
    editor.querySelectorAll(
      ".mask"
    );

  masks.forEach(
    function(element){

      const id =
        element.dataset.maskId;

      const mask =
        state.masks.find(
          function(item){

            return item.id === id;

          }
        );

      if(!mask){

        return;

      }

      /* =========================
         赤枠移動
      ========================= */

      element.addEventListener(
        "pointerdown",
        function(event){

          if(
            event.target.classList.contains(
              "resize-handle"
            )
          ){

            return;

          }

          event.preventDefault();

          event.stopPropagation();

          state.selectedMask =
            id;

          const rect =
            editor.getBoundingClientRect();

          const startX =
            event.clientX;

          const startY =
            event.clientY;

          const startLeft =
            mask.x;

          const startTop =
            mask.y;

          element.setPointerCapture(
            event.pointerId
          );

          function move(ev){

            const dx =
              (
                ev.clientX -
                startX
              ) /
              rect.width *
              100;

            const dy =
              (
                ev.clientY -
                startY
              ) /
              rect.height *
              100;

            mask.x =
              Math.max(
                0,
                Math.min(
                  100 - mask.w,
                  startLeft + dx
                )
              );

            mask.y =
              Math.max(
                0,
                Math.min(
                  100 - mask.h,
                  startTop + dy
                )
              );

            element.style.left =
              mask.x + "%";

            element.style.top =
              mask.y + "%";

          }

          function end(){

            try{

              element.releasePointerCapture(
                event.pointerId
              );

            }catch(error){}

            element.removeEventListener(
              "pointermove",
              move
            );

            element.removeEventListener(
              "pointerup",
              end
            );

          }

          element.addEventListener(
            "pointermove",
            move
          );

          element.addEventListener(
            "pointerup",
            end
          );

        }
      );

      /* =========================
         サイズ変更
      ========================= */

      const handle =
        element.querySelector(
          ".resize-handle"
        );

      if(!handle){

        return;

      }

      handle.addEventListener(
        "pointerdown",
        function(event){

          event.preventDefault();

          event.stopPropagation();

          const rect =
            editor.getBoundingClientRect();

          const startX =
            event.clientX;

          const startY =
            event.clientY;

          const startW =
            mask.w;

          const startH =
            mask.h;

          handle.setPointerCapture(
            event.pointerId
          );

          function resize(ev){

            const dx =
              (
                ev.clientX -
                startX
              ) /
              rect.width *
              100;

            const dy =
              (
                ev.clientY -
                startY
              ) /
              rect.height *
              100;

            mask.w =
              Math.max(
                0.5,
                Math.min(
                  100 - mask.x,
                  startW + dx
                )
              );

            mask.h =
              Math.max(
                0.5,
                Math.min(
                  100 - mask.y,
                  startH + dy
                )
              );

            element.style.width =
              mask.w + "%";

            element.style.height =
              mask.h + "%";

          }

          function end(){

            try{

              handle.releasePointerCapture(
                event.pointerId
              );

            }catch(error){}

            handle.removeEventListener(
              "pointermove",
              resize
            );

            handle.removeEventListener(
              "pointerup",
              end
            );

          }

          handle.addEventListener(
            "pointermove",
            resize
          );

          handle.addEventListener(
            "pointerup",
            end
          );

        }
      );

    }
  );

            }
  /* =================================================
   問題の並び替え
   スマホ専用：長押し → 指で上下に移動
================================================= */

function enableSorting(){

  const list =
    $("problem-list");

  if(!list){

    return;

  }

  const rows =
    [...list.querySelectorAll(
      ".problem-row"
    )];

  let activeRow =
    null;

  let longPressTimer =
    null;

  let isDragging =
    false;

  let startY =
    0;

  rows.forEach(
    function(row){

      row.addEventListener(
        "pointerdown",
        function(event){

          if(
            event.target.closest(
              "button"
            )
          ){

            return;

          }

          startY =
            event.clientY;

          activeRow =
            row;

          isDragging =
            false;

          longPressTimer =
            setTimeout(
              function(){

                isDragging =
                  true;

                row.classList.add(
                  "dragging"
                );

                if(
                  navigator.vibrate
                ){

                  navigator.vibrate(
                    40
                  );

                }

              },
              350
            );

          row.setPointerCapture(
            event.pointerId
          );

        }
      );

      row.addEventListener(
        "pointermove",
        function(event){

          if(
            !activeRow ||
            activeRow !== row
          ){

            return;

          }

          if(!isDragging){

            const distance =
              Math.abs(
                event.clientY -
                startY
              );

            if(distance > 8){

              clearTimeout(
                longPressTimer
              );

              activeRow =
                null;

            }

            return;

          }

          event.preventDefault();

          const otherRows =
            [
              ...list.querySelectorAll(
                ".problem-row"
              )
            ].filter(
              function(item){

                return item !== row;

              }
            );

          let target =
            null;

          let closest =
            Infinity;

          otherRows.forEach(
            function(other){

              const rect =
                other.getBoundingClientRect();

              const center =
                rect.top +
                rect.height / 2;

              const distance =
                Math.abs(
                  event.clientY -
                  center
                );

              if(
                distance <
                closest
              ){

                closest =
                  distance;

                target =
                  other;

              }

            }
          );

          if(!target){

            return;

          }

          const targetRect =
            target.getBoundingClientRect();

          const targetCenter =
            targetRect.top +
            targetRect.height / 2;

          if(
            event.clientY <
            targetCenter
          ){

            list.insertBefore(
              row,
              target
            );

          }else{

            list.insertBefore(
              row,
              target.nextSibling
            );

          }

        }
      );

      row.addEventListener(
        "pointerup",
        function(){

          clearTimeout(
            longPressTimer
          );

          if(
            isDragging
          ){

            saveProblemOrder();

          }

          row.classList.remove(
            "dragging"
          );

          activeRow =
            null;

          isDragging =
            false;

        }
      );

      row.addEventListener(
        "pointercancel",
        function(){

          clearTimeout(
            longPressTimer
          );

          row.classList.remove(
            "dragging"
          );

          activeRow =
            null;

          isDragging =
            false;

        }
      );

    }
  );

}

function saveProblemOrder(){

  const test =
    getTest();

  const list =
    $("problem-list");

  if(
    !test ||
    !list
  ){

    return;

  }

  const ids =
    [
      ...list.querySelectorAll(
        ".problem-row"
      )
    ].map(
      function(row){

        return row.dataset.problemId;

      }
    );

  const newProblems =
    [];

  ids.forEach(
    function(id){

      const problem =
        test.problems.find(
          function(item){

            return item.id === id;

          }
        );

      if(problem){

        newProblems.push(
          problem
        );

      }

    }
  );

  test.problems =
    newProblems;

  saveDB();

  showToast(
    "並び順を保存しました"
  );

}

/* =================================================
   問題削除
================================================= */

function deleteProblem(id){

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "この問題を削除しますか？"
    )
  ){

    return;

  }

  test.problems =
    test.problems.filter(
      function(problem){

        return problem.id !== id;

      }
    );

  if(
    state.problemId === id
  ){

    state.problemId =
      null;

    state.editImage =
      null;

    state.masks =
      [];

    state.selectedMask =
      null;

  }

  saveDB();

  render();

}

/* =================================================
   現在の問題を削除
================================================= */

function deleteCurrentProblem(){

  if(!state.problemId){

    return;

  }

  const id =
    state.problemId;

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "この問題を削除しますか？"
    )
  ){

    return;

  }

  test.problems =
    test.problems.filter(
      function(problem){

        return problem.id !== id;

      }
    );

  state.problemId =
    null;

  state.editImage =
    null;

  state.masks =
    [];

  state.selectedMask =
    null;

  saveDB();

  go("create");

}

/* =================================================
   次の問題を作成
================================================= */

function addProblemFromEdit(){

  const problem =
    getProblem();

  if(problem){

    if(state.editImage){

      problem.image =
        state.editImage;

      problem.masks =
        state.masks.map(
          function(mask){

            return {

              id:mask.id,

              x:mask.x,

              y:mask.y,

              w:mask.w,

              h:mask.h

            };

          }
        );

      problem.revealed =
        {};

    }

    saveDB();

  }

  addProblem();

}

/* =================================================
   テスト削除
================================================= */

function deleteTest(){

  const test =
    getTest();

  if(!test){

    return;

  }

  if(
    !confirm(
      "このテストを削除しますか？\n\nこの操作は元に戻せません。"
    )
  ){

    return;

  }

  db.tests =
    db.tests.filter(
      function(item){

        return item.id !== test.id;

      }
    );

  if(
    db.fixedId === test.id
  ){

    db.fixedId =
      null;

  }

  state.testId =
    null;

  state.problemId =
    null;

  saveDB();

  go("home");

}

/* =================================================
   イベント処理
================================================= */

function bindEvents(){

  /* -------------------------
     新しいテスト
  ------------------------- */

  const newTest =
    $("new-test");

  if(newTest){

    newTest.onclick =
      createTest;

  }

  /* -------------------------
     問題追加
  ------------------------- */

  const addProblemButton =
    $("add-problem");

  if(addProblemButton){

    addProblemButton.onclick =
      addProblem;

  }

  /* -------------------------
     問題編集
  ------------------------- */

  document
    .querySelectorAll(
      ".edit-problem"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            openProblem(
              button.dataset.id
            );

          };

      }
    );

  /* -------------------------
     問題削除
  ------------------------- */

  document
    .querySelectorAll(
      ".delete-problem"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            deleteProblem(
              button.dataset.id
            );

          };

      }
    );

  /* -------------------------
     テスト名保存
  ------------------------- */

  const testName =
    $("test-name");

  const saveCreate =
    $("save-create");

  if(saveCreate){

    saveCreate.onclick =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        test.name =
          testName.value.trim() ||
          "無題のテスト";

        saveDB();

        go("home");

      };

  }

  /* -------------------------
     画像選択
  ------------------------- */

  const pickImage =
    $("pick-image");

  const imageInput =
    $("image-input");

  if(
    pickImage &&
    imageInput
  ){

    pickImage.onclick =
      function(){

        imageInput.click();

      };

    imageInput.onchange =
      function(){

        const file =
          imageInput.files &&
          imageInput.files[0];

        if(file){

          readImage(file);

        }

      };

  }

  /* -------------------------
     問題保存
  ------------------------- */

  const saveProblemButton =
    $("save-problem");

  if(saveProblemButton){

    saveProblemButton.onclick =
      saveProblem;

  }

  /* -------------------------
     赤枠追加
  ------------------------- */

  const addMaskButton =
    $("add-mask");

  if(addMaskButton){

    addMaskButton.onclick =
      addMask;

  }

  /* -------------------------
     赤枠削除
  ------------------------- */

  document
    .querySelectorAll(
      ".delete-mask"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            const id =
              button.dataset.id;

            state.masks =
              state.masks.filter(
                function(mask){

                  return mask.id !== id;

                }
              );

            if(
              state.selectedMask === id
            ){

              state.selectedMask =
                null;

            }

            render();

          };

      }
    );

  /* -------------------------
     保存して次の問題
  ------------------------- */

  const addNext =
    $("add-problem-from-edit");

  if(addNext){

    addNext.onclick =
      addProblemFromEdit;

  }

  /* -------------------------
     現在の問題削除
  ------------------------- */

  const deleteCurrent =
    $("delete-current-problem");

  if(deleteCurrent){

    deleteCurrent.onclick =
      deleteCurrentProblem;

  }

  /* -------------------------
     設定画面
  ------------------------- */

  document
    .querySelectorAll(
      ".settings-test"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            state.testId =
              button.dataset.id;

            go("settings");

          };

      }
    );

  /* -------------------------
     ホームへ
  ------------------------- */

  document
    .querySelectorAll(
      ".back-home"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            go("home");

          };

      }
    );

  const backHome =
    $("back-home");

  if(backHome){

    backHome.onclick =
      function(){

        go("home");

      };

  }

  const backCreate =
    $("back-create");

  if(backCreate){

    backCreate.onclick =
      function(){

        go("create");

      };

  }

  /* -------------------------
     設定：テスト名
  ------------------------- */

  const settingName =
    $("setting-name");

  if(settingName){

    settingName.onchange =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        test.name =
          settingName.value.trim() ||
          "無題のテスト";

        saveDB();

      };

  }

  /* -------------------------
     設定：固定
  ------------------------- */

  const fixedTest =
    $("fixed-test");

  if(fixedTest){

    fixedTest.onchange =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        if(fixedTest.checked){

          db.fixedId =
            test.id;

        }else{

          if(
            db.fixedId === test.id
          ){

            db.fixedId =
              null;

          }

        }

        saveDB();

        render();

      };

  }

  /* -------------------------
     設定：削除
  ------------------------- */

  const deleteTestButton =
    $("delete-test");

  if(deleteTestButton){

    deleteTestButton.onclick =
      deleteTest;

  }

  /* -------------------------
     解答開始
  ------------------------- */

  document
    .querySelectorAll(
      ".play-test"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            state.testId =
              button.dataset.id;

            state.answerIndex =
              0;

            const test =
              getTest();

            if(
              !test ||
              test.problems.length === 0
            ){

              showToast(
                "このテストには問題がありません"
              );

              return;

            }

            test.problems.forEach(
              function(problem){

                problem.revealed =
                  {};

              }
            );

            saveDB();

            go("play");

          };

      }
    );

  /* -------------------------
     解答：赤枠
  ------------------------- */

  document
    .querySelectorAll(
      ".answer-mask"
    )
    .forEach(
      function(mask){

        mask.onclick =
          function(){

            const test =
              getTest();

            if(!test){

              return;

            }

            const problem =
              test.problems[
                state.answerIndex
              ];

            if(!problem){

              return;

            }

            if(!problem.revealed){

              problem.revealed =
                {};

            }

            const id =
              mask.dataset.maskId;

            problem.revealed[id] =
              true;

            saveDB();

            render();

          };

      }
    );

  /* -------------------------
     前へ
  ------------------------- */

  const prev =
    $("prev");

  if(prev){

    prev.onclick =
      function(){

        if(
          state.answerIndex > 0
        ){

          state.answerIndex--;

          render();

        }

      };

  }

  /* -------------------------
     次へ
  ------------------------- */

  const next =
    $("next");

  if(next){

    next.onclick =
      function(){

        const test =
          getTest();

        if(!test){

          return;

        }

        if(
          state.answerIndex <
          test.problems.length - 1
        ){

          state.answerIndex++;

          render();

        }else{

          go("home");

        }

      };

  }

  /* -------------------------
     終了
  ------------------------- */

  document
    .querySelectorAll(
      ".quit"
    )
    .forEach(
      function(button){

        button.onclick =
          function(){

            go("home");

          };

      }
    );

  /* -------------------------
     赤枠操作
  ------------------------- */

  setupMaskControls();

  /* -------------------------
     並び替え
  ------------------------- */

  enableSorting();

}

/* =================================================
   描画
================================================= */

function render(){

  const app =
    $("app");

  if(!app){

    return;

  }

  try{

    switch(
      state.screen
    ){

      case "home":

        app.innerHTML =
          renderHome();

        break;

      case "create":

        app.innerHTML =
          renderCreate();

        break;

      case "edit":

        app.innerHTML =
          renderEdit();

        break;

      case "settings":

        app.innerHTML =
          renderSettings();

        break;

      case "play":

        app.innerHTML =
          renderPlay();

        break;

      default:

        state.screen =
          "home";

        app.innerHTML =
          renderHome();

    }

    bindEvents();

  }catch(error){

    console.error(
      "描画エラー:",
      error
    );

    app.innerHTML = `

      <div class="app">

        <h1>
          エラーが発生しました
        </h1>

        <div class="card">

          <p>
            アプリの読み込み中に
            エラーが発生しました。
          </p>

          <p class="small muted">
            ${escapeHTML(
              error.message
            )}
          </p>

          <button
            class="blue"
            onclick="location.reload()">
            再読み込み
          </button>

        </div>

      </div>

    `;

  }

}

/* =================================================
   起動
================================================= */

function start(){

  loadDB();

  /*
    固定されたテストが存在し、
    問題も1問以上ある場合は
    起動直後にそのテストを開始
  */

  if(
    db.fixedId &&
    db.tests.some(
      function(test){

        return (
          test.id ===
          db.fixedId
        );

      }
    )
  ){

    state.testId =
      db.fixedId;

    state.answerIndex =
      0;

    const test =
      getTest();

    if(
      test &&
      test.problems.length > 0
    ){

      test.problems.forEach(
        function(problem){

          problem.revealed =
            {};

        }
      );

      saveDB();

      state.screen =
        "play";

    }else{

      state.screen =
        "home";

    }

  }else{

    state.screen =
      "home";

  }

  render();

}

start();
